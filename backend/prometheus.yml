global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "observability/dashboards/prometheus-rules.yml"

scrape_configs:
  - job_name: "grafana"
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: "soc-copilot-backend"
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          service: "backend"
    metrics_path: "/metrics/prometheus"
    scrape_interval: 10s

  - job_name: "loki"
    static_configs:
      - targets: ["loki:3100"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

alerting:
  alertmanagers:
    - static_configs:
        - targets: []
