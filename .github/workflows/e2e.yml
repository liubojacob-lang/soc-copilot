name: E2E (Playwright)

# The 12 specs under frontend/e2e existed for months without ever running in CI.
# This workflow is deliberately scheduled rather than a required check: nobody
# has run the suite against the current password policy and seed data yet, so
# the first runs are expected to surface real staleness. Triage them, then
# promote chromium-e2e to a required check once it is green twice in a row.

on:
  schedule:
    - cron: "30 2 * * *" # nightly, 02:30 UTC
  push:
    branches:
      - master
      - "release/**"
  pull_request:
    branches:
      - master
      - "release/**"
  workflow_dispatch:
    inputs:
      grep:
        description: "Only run specs matching this title substring (playwright -g)"
        required: false
        default: ""

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  BACKEND_PORT: "8088" # matches next.config.js NEXT_PUBLIC_API_URL default
  E2E_BASE_URL: "http://localhost:3003"

jobs:
  e2e:
    name: chromium-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: soc_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Generate throwaway credentials
        id: creds
        run: |
          # Fernet key = 32 url-safe base64 bytes; generated with openssl so the
          # step does not depend on the Python setup. An admin password that
          # satisfies the production strength policy (>=12 chars, mixed case,
          # digit, symbol). Nothing here is a real secret: the whole environment
          # is discarded with the runner.
          echo "fernet_key=$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=' | cut -c1-44)" >> "$GITHUB_OUTPUT"
          echo "admin_password=E2e-$(openssl rand -hex 9)!9" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install cryptography

      - name: Start backend
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/soc_e2e
          REDIS_URL: redis://localhost:6379/0
          REDIS_ENABLED: "true"
          ENVIRONMENT: development
          JWT_SECRET: ci-only-jwt-secret-not-used-outside-this-workflow
          SECRET_KEY: ci-only-secret-key-not-used-outside-this-workflow
          BOOTSTRAP_ADMIN_PASSWORD: ${{ steps.creds.outputs.admin_password }}
          SECRET_ENCRYPTION_KEY: ${{ steps.creds.outputs.fernet_key }}
        run: |
          nohup python -m uvicorn main:app --host 127.0.0.1 --port ${{ env.BACKEND_PORT }} \
            > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS "http://127.0.0.1:${{ env.BACKEND_PORT }}/api/health" >/dev/null 2>&1; then
              echo "backend ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "backend did not become ready"; tail -50 /tmp/backend.log; exit 1

      - name: Seed demo data
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/soc_e2e
          ENVIRONMENT: development
          JWT_SECRET: ci-only-jwt-secret-not-used-outside-this-workflow
          SECRET_ENCRYPTION_KEY: ${{ steps.creds.outputs.fernet_key }}
          BOOTSTRAP_ADMIN_PASSWORD: ${{ steps.creds.outputs.admin_password }}
        run: python scripts/seed_demo_data.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        working-directory: ./frontend
        env:
          E2E_BASE_URL: ${{ env.E2E_BASE_URL }}
          E2E_ADMIN_USERNAME: admin
          E2E_ADMIN_PASSWORD: ${{ steps.creds.outputs.admin_password }}
          E2E_GREP: ${{ github.event.inputs.grep }}
          CI: "true"
        run: |
          if [ -n "$E2E_GREP" ]; then
            npx playwright test --project=chromium -g "$E2E_GREP"
          else
            npx playwright test --project=chromium
          fi

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14

      - name: Upload backend log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: /tmp/backend.log
          retention-days: 7
