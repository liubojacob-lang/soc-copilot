[pytest]
# Pytest configuration for SOC Copilot

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Default options
addopts =
    # Verbose output
    -v
    # Short traceback format
    --tb=short
    # Strict marker enforcement
    --strict-markers
    # Coverage settings
    --cov=.
    --cov-config=.coveragerc
    --cov-report=html
    --cov-report=term-missing
    --cov-report=json
    # Coverage threshold: floor at the current measured baseline (~30%) to
    # prevent regression. Raise toward the 50%/60% goals as coverage improves.
    --cov-fail-under=30
    # Show summary of all test outcomes
    -ra
    # Warnings - ignore all deprecation warnings for Python 3.14 compatibility
    -W ignore::DeprecationWarning

# Asyncio mode
asyncio_mode = auto

# NOTE: test environment variables (ENVIRONMENT, JWT_SECRET, etc.) are set
# in tests/conftest.py at module level + pytest_configure(). Do NOT add an
# `env =` block here — it requires the pytest-env plugin (not installed)
# and produces a misleading "Unknown config option: env" warning.

# Test markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, may use external services)
    e2e: End-to-end tests (slowest, full system tests)
    slow: Slow-running tests
    api: API endpoint tests
    auth: Authentication and authorization tests
    ai: AI service tests
    ti: Threat intelligence tests
    playbook: Playbook engine tests
    audit: Audit logging tests
    redis: Tests requiring Redis
    database: Tests requiring database
    network: Tests requiring network access
