# Dependabot 安全扫描工作流
# 使用 pip-audit 进行依赖漏洞检测，发现高危漏洞时自动创建 GitHub Issue

name: Dependency Security Audit

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 每周日 00:00 UTC 运行
    - cron: "0 0 * * 0"

permissions:
  contents: read
  issues: write
  actions: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  pip-audit:
    name: Python Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Run pip-audit
        id: audit
        working-directory: ./backend
        run: |
          pip-audit --format=json --desc --requirement=requirements.txt --output=pip-audit-report.json || true
          echo "Audit completed"

      - name: Upload audit report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-report
          path: backend/pip-audit-report.json
          retention-days: 30

      - name: Parse high/critical vulnerabilities
        id: parse
        if: always()
        run: |
          python << 'PYEOF'
          import json
          import sys
          from pathlib import Path

          report_path = Path("backend/pip-audit-report.json")
          if not report_path.exists():
              print("No audit report found.")
              sys.exit(0)

          with open(report_path, "r", encoding="utf-8") as f:
              try:
                  data = json.load(f)
              except json.JSONDecodeError:
                  print("Invalid JSON in report.")
                  sys.exit(0)

          # pip-audit JSON format: list of dicts with dependencies -> vulnerabilities
          high_critical = []
          for dep in data:
              vulns = dep.get("vulnerabilities", [])
              for v in vulns:
                  severity = v.get("severity", "")
                  # Score-based severity mapping
                  if isinstance(severity, list) and severity:
                      # Try to find highest severity from list of scores
                      max_score = 0
                      for s in severity:
                          if isinstance(s, dict):
                              score = s.get("score", 0)
                              if isinstance(score, (int, float)) and score >= 7.0:
                                  max_score = score
                          elif isinstance(s, str) and s.lower() in ("high", "critical"):
                              max_score = 8.0
                      if max_score >= 7.0:
                          high_critical.append({
                              "name": dep.get("name", "unknown"),
                              "version": dep.get("version", "unknown"),
                              "vuln_id": v.get("id", "unknown"),
                              "description": v.get("description", "No description"),
                              "fix_versions": v.get("fix_versions", []),
                              "severity": max_score,
                          })
                  elif isinstance(severity, str):
                      if severity.lower() in ("high", "critical"):
                          high_critical.append({
                              "name": dep.get("name", "unknown"),
                              "version": dep.get("version", "unknown"),
                              "vuln_id": v.get("id", "unknown"),
                              "description": v.get("description", "No description"),
                              "fix_versions": v.get("fix_versions", []),
                              "severity": severity,
                          })
                  else:
                      # Default: treat as high if description contains certain keywords
                      desc = v.get("description", "").lower()
                      if any(k in desc for k in ("remote code execution", "rce", "critical", "high severity")):
                          high_critical.append({
                              "name": dep.get("name", "unknown"),
                              "version": dep.get("version", "unknown"),
                              "vuln_id": v.get("id", "unknown"),
                              "description": v.get("description", "No description"),
                              "fix_versions": v.get("fix_versions", []),
                              "severity": "unknown (high keyword match)",
                          })

          if high_critical:
              print("HIGH_CRITICAL_FOUND=true")
              # Write summary for issue body
              summary_lines = ["## 高危依赖漏洞告警", ""]
              for v in high_critical:
                  summary_lines.append(f"### {v['name']}@{v['version']} — {v['vuln_id']}")
                  summary_lines.append(f"- **严重级别**: {v['severity']}")
                  summary_lines.append(f"- **描述**: {v['description']}")
                  if v['fix_versions']:
                      summary_lines.append(f"- **修复版本**: {', '.join(v['fix_versions'])}")
                  summary_lines.append("")
              summary_lines.append("---")
              summary_lines.append("此 Issue 由 `security-audit.yml` 工作流自动创建。")
              summary_lines.append(f"检测到 **{len(high_critical)}** 个高危/严重漏洞。")
              with open("pip-audit-summary.md", "w", encoding="utf-8") as out:
                  out.write("\n".join(summary_lines))
          else:
              print("HIGH_CRITICAL_FOUND=false")
          PYEOF
        continue-on-error: true

      - name: Create GitHub Issue for high/critical vulnerabilities
        if: steps.parse.outputs.HIGH_CRITICAL_FOUND == 'true' || always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'pip-audit-summary.md';
            if (!fs.existsSync(path)) {
              core.info('No high/critical vulnerabilities found. Skipping issue creation.');
              return;
            }
            const body = fs.readFileSync(path, 'utf-8');
            const title = `🚨 Dependency Security Alert — ${new Date().toISOString().split('T')[0]}`;

            // Check for existing open issues with same title pattern
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,dependencies',
              per_page: 10
            });

            const duplicate = issues.data.find(i => i.title.startsWith('🚨 Dependency Security Alert'));
            if (duplicate) {
              // Update existing issue with comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: duplicate.number,
                body: `## 重新扫描结果 (${new Date().toISOString()})
            \n${body}`
              });
              core.info(`Updated existing issue #${duplicate.number} with new scan results.`);
            } else {
              // Create new issue
              const newIssue = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['security', 'dependencies', 'pip-audit']
              });
              core.info(`Created issue #${newIssue.data.number} for high/critical vulnerabilities.`);
            }
