# Pre-commit hooks configuration
# Install: pip install pre-commit && pre-commit install
# 分支命名验证相关配置详见 .github/branch-protection-rules.json
repos:
  # Backend Python hooks
  - repo: https://github.com/psf/black
    rev: 26.5.1  # matches CI/backend formatting (T-ruff-backlog note)
    hooks:
      - id: black
        language_version: python3.12

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        # first-party 分组必须显式传参：isort 只按"第一个被检查文件"所在目录查找
        # pyproject.toml，而 pre-commit 会把所有文件一次性传入；只要列表里混入
        # backend 之外的文件（根目录的 .py / .md 等），isort 就会退化成"全部按第三方
        # 排序"，与 ruff(I001) 的分组判据冲突，两者互相改写、CI 永远红。
        # 注意 isort 的 CLI 选项是 -p/--project（不支持 --known-first-party，
        # 且逗号不会拆分），需逐个 -p 传入。
        # 此列表需与 backend/pyproject.toml [tool.isort] 及
        # backend/ruff.toml [lint.isort] known-first-party 保持一致。
        args:
          - --profile=black
          - -p
          - core
          - -p
          - models
          - -p
          - routers
          - -p
          - services
          - -p
          - middleware
          - -p
          - dependencies
          - -p
          - db
          - -p
          - schemas
          - -p
          - repositories

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies:
          - types-requests
        args: [--ignore-missing-imports, --follow-imports=skip]
        exclude: ^tests/

  # Frontend hooks
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [javascript, jsx, ts, tsx, json, css]
        exclude: ^frontend/node_modules/

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.56.0
    hooks:
      - id: eslint
        files: ^frontend/.*\.(js|jsx|ts|tsx)$
        args: [--fix]
        additional_dependencies:
          - eslint@9
          - eslint-config-next@15.1.0
        exclude: ^frontend/node_modules/

  # General hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      # pre-commit 的 identify 会把 README.png 同时标记为 binary 和 text，
      # 所以 types: [text] 挡不住它 —— 必须按扩展名显式排除二进制文件，
      # 否则下面这些"文本修复"钩子会重写 PNG/EXE 内容并损坏它们。
      - id: trailing-whitespace
        exclude: &binary_files \.(png|jpe?g|gif|webp|ico|bmp|svgz|pdf|zip|gz|tgz|woff2?|ttf|otf|eot|mp[34]|mov|webm|so|dylib|dll|exe|bin|pyc|class|jar|db|sqlite)$
      - id: end-of-file-fixer
        exclude: *binary_files
      # k8s/*.yaml 是多文档 YAML，check-yaml 默认只接受单文档，
      # 会报 "expected a single document in the stream"。
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        exclude: *binary_files

  # Branch naming validation (FR-001)
  - repo: local
    hooks:
      - id: validate-branch-name
        name: Validate branch name
        entry: ./scripts/validate-branch-name.sh
        language: script
        pass_filenames: false
        always_run: false
        stages: [pre-push]
        description: Validates current branch name follows naming convention (FR-001)
