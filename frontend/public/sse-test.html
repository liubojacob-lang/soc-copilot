<!DOCTYPE html>
<html>
<head><title>SSE Test</title></head>
<body>
<h1>SSE Connection Test</h1>
<div id="status">Connecting...</div>
<div id="messages"></div>
<script>
const eventSource = new EventSource('/api/monitor/stream');
const statusDiv = document.getElementById('status');
const messagesDiv = document.getElementById('messages');

eventSource.onopen = () => {
    statusDiv.innerHTML = '<span style="color: green">✓ Connected via SSE</span>';
    console.log('[Test] SSE connection opened');
};

eventSource.onmessage = (e) => {
    const data = JSON.parse(e.data);
    const msg = document.createElement('div');
    msg.textContent = new Date().toLocaleTimeString() + ': ' + (data.heartbeat ? 'Heartbeat' : 'Data');
    messagesDiv.insertBefore(msg, messagesDiv.firstChild);
    
    // Keep only last 10 messages
    while (messagesDiv.children.length > 10) {
        messagesDiv.removeChild(messagesDiv.lastChild);
    }
    console.log('[Test] Message received:', data);
};

eventSource.onerror = (err) => {
    statusDiv.innerHTML = '<span style="color: red">✗ Connection Error</span>';
    console.error('[Test] SSE error:', err);
};
</script>
</body>
</html>
