<!--
  Wazuh configuration file
  Basic configuration for SOC Copilot integration
-->

<ossec_config>
  <alerts>
    <log_level>3</log_level>
    <email_notification>no</email_notification>
  </alerts>

  <!-- Global rules -->
  <ruleset>
    <!-- Default rules directory -->
    <rule_dir>ruleset/rules</rule_dir>
    <rule_dir>ruleset/atomic</rule_dir>
    <rule_dir>ruleset/sudo</rule_dir>
    <rule_dir>ruleset/attack</rule_dir>
  </ruleset>

  <!-- Syslog collector -->
  <remote>
    <connection>secure</connection>
    <port>1514</port>
    <protocol>tcp</protocol>
    <allowed-ips>0.0.0.0/0</allowed-ips>
  </remote>

  <!-- Log analysis -->
  <localfile>
    <location>/var/ossec/logs/alerts/alerts.log</location>
    <log_format>syslog</log_format>
  </localfile>
</ossec_config>

<!-- Agent configuration -->
<ossec_config>
  <client>
    <server-ip>127.0.0.1</server-ip>
    <!--
    <config-profile>
      <profile>generic</profile>
    </config-profile>
    -->
  </client>
</ossec_config>

<!-- Active Response -->
<ossec_config>
  <active-response>
    <disabled>no</disabled>
    <command>host-deny</command>
    <location>local</location>
    <rules_id>31101,31102</rules_id>
    <timeout>300</timeout>
  </active-response>
</ossec_config>
