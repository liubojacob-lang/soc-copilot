# Wazuh Security Stack for SOC Copilot
version: '3.8'

services:
  # Elasticsearch - SIEM 数据存储
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: soc-elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
      - xpack.security.enabled=true
      - "ELASTIC_PASSWORD=${ELASTICSEARCH_PASSWORD:?ELASTICSEARCH_PASSWORD is required}"
      - "indices.id_field_data.enabled=true"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "127.0.0.1:9200:9200"
      - "127.0.0.1:9300:9300"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - soc-copilot-network
    restart: unless-stopped

  # Kibana - 可视化界面
  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: soc-kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - "ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD:?ELASTICSEARCH_PASSWORD is required}"
      - SERVER_NAME=kibana
      - SERVER_HOST="0.0.0.0"
    volumes:
      - kibana_data:/usr/share/kibana/data
    ports:
      - "127.0.0.1:5601:5601"
    networks:
      - soc-copilot-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Wazuh Manager - SIEM 平台
  wazuh-manager:
    image: wazuh/wazuh-manager:4.8.0
    container_name: soc-wazuh-manager
    hostname: wazuh-manager
    ports:
      - "127.0.0.1:1514:1514/tcp"
      - "127.0.0.1:1514:1514/udp"
      - "127.0.0.1:55000:55000/tcp"
    environment:
      - INDEXER_URL=https://elasticsearch:9200
      - INDEXER_USERNAME=elastic
      - "INDEXER_PASSWORD=${ELASTICSEARCH_PASSWORD:?ELASTICSEARCH_PASSWORD is required}"
      - API_USERNAME=wazuh-wui
      - "API_PASSWORD=${WAZUH_API_PASSWORD:?WAZUH_API_PASSWORD is required}"
    volumes:
      - wazuh_data:/var/ossec/data
      - ./config/wazuh/ossec.conf:/var/ossec/etc/ossec.conf:ro
    networks:
      - soc-copilot-network
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  # Wazuh Dashboard - Wazuh 管理界面
  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.8.0
    container_name: soc-wazuh-dashboard
    depends_on:
      - elasticsearch
      - wazuh-manager
    ports:
      - "127.0.0.1:444:443"
    environment:
      - DASHBOARD_USERNAME=admin
      - "DASHBOARD_PASSWORD=${WAZUH_DASHBOARD_PASSWORD:?WAZUH_DASHBOARD_PASSWORD is required}"
      - WAZUH_API_URL=https://wazuh-manager
      - API_USERNAME=wazuh-wui
      - "API_PASSWORD=${WAZUH_API_PASSWORD:?WAZUH_API_PASSWORD is required}"
    networks:
      - soc-copilot-network
    restart: unless-stopped

volumes:
  elasticsearch_data:
    name: sec-elasticsearch-data
  kibana_data:
    name: sec-kibana-data
  wazuh_data:
    name: sec-wazuh-data

networks:
  soc-copilot-network:
    name: soc-copilot-network
    external: true
