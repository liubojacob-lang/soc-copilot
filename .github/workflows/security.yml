# GitHub Actions Workflow for Automated Security Scanning
# Runs on every push and pull request to catch security issues early

name: Security Scanning

on:
  push:
    branches: [main, develop, "release/*"]
  pull_request:
    branches: [main]
  schedule:
    # Run security scan daily at 2 AM UTC
    - cron: "0 2 * * *"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ==========================================
  # Python Dependency Security Scan
  # ==========================================
  python-dependencies:
    name: Python Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install safety pip-audit

      - name: Run Safety Check
        working-directory: ./backend
        run: |
          safety check -r requirements.txt --json || true
        continue-on-error: true

      - name: Run Pip Audit
        working-directory: ./backend
        run: |
          pip-audit -r requirements.txt --format json || true
        continue-on-error: true

  # ==========================================
  # Node.js Dependency Security Scan
  # ==========================================
  node-dependencies:
    name: Node.js Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run npm audit
        working-directory: ./frontend
        run: |
          npm audit --json || true
          npm audit --audit-level=moderate
        continue-on-error: true

  # ==========================================
  # Docker Image Security Scan (Trivy)
  # ==========================================
  docker-scan:
    name: Docker Image Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "python:3.12-slim"
          format: "table"
          exit-code: "0" # Don't fail CI, just report
          ignore-unfixed: true
          severity: "CRITICAL,HIGH"

  # ==========================================
  # Secret Detection
  # ==========================================
  secret-detection:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Check for hardcoded passwords
        run: |
          echo "🔍 Scanning for hardcoded passwords..."

          # Check for common password patterns
          if grep -r "password.*=.*['\"].*['\"]" --include="*.py" --include="*.js" --include="*.ts" --include="*.yml" \
            --exclude-dir=node_modules --exclude-dir=venv --exclude-dir=.next \
            --exclude="*.test.py" --exclude="*.spec.ts" .; then
            echo "⚠️  Found potential hardcoded passwords!"
          else
            echo "✅ No hardcoded passwords found"
          fi

          # Check for default passwords
          if grep -r "changeme\|password123\|admin123\|SecureP@ssw0rd" \
            --include="*.py" --include="*.yml" --include="*.env*" \
            --exclude-dir=node_modules --exclude-dir=venv .; then
            echo "❌ Found default passwords!"
            exit 1
          else
            echo "✅ No default passwords found"
          fi
        continue-on-error: true

  # ==========================================
  # Static Application Security Testing (SAST)
  # ==========================================
  sast-scan:
    name: SAST Scan (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        working-directory: ./backend
        run: |
          bandit -r . -f json -o bandit-report.json || true
          bandit -r . -ll  # Only show high/critical issues
        continue-on-error: true

      - name: Upload Bandit Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-security-report
          path: backend/bandit-report.json
          retention-days: 30

  # ==========================================
  # Docker Compose Configuration Validation
  # ==========================================
  docker-compose-validation:
    name: Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          echo "🔍 Validating Docker Compose files..."

          # Check for required environment variables
          if grep -q "DB_PASSWORD:-changeme" docker-compose.yml; then
            echo "❌ Found default DB_PASSWORD in docker-compose.yml"
            exit 1
          fi

          if grep -q "SECRET_KEY:-your-secret" docker-compose.yml; then
            echo "❌ Found default SECRET_KEY in docker-compose.yml"
            exit 1
          fi

          echo "✅ Docker Compose validation passed"

      - name: Validate .dockerignore exists
        run: |
          echo "🔍 Checking .dockerignore files..."

          for file in .dockerignore backend/.dockerignore frontend/.dockerignore; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing $file"
              exit 1
            fi
            echo "✅ Found $file"
          done

  # ==========================================
  # Frontend Security Lint
  # ==========================================
  frontend-security-lint:
    name: Frontend Security Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run ESLint with security plugin
        working-directory: ./frontend
        run: npm run lint
        continue-on-error: true

      - name: Check for dangerous patterns
        run: |
          echo "🔍 Scanning frontend for security issues..."

          # Check for dangerouslySetInnerHTML usage
          if grep -r "dangerouslySetInnerHTML" frontend/app frontend/components --include="*.tsx" --include="*.ts"; then
            echo "⚠️  Found dangerouslySetInnerHTML - review for XSS risks"
          fi

          # Check for localStorage token storage
          if grep -r "localStorage.*token\|localStorage.*access_token" frontend --include="*.tsx" --include="*.ts"; then
            echo "⚠️  Found localStorage token storage - consider HttpOnly cookies"
          fi

  # ==========================================
  # Security Report Summary
  # ==========================================
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs:
      - python-dependencies
      - node-dependencies
      - docker-scan
      - secret-detection
      - sast-scan
      - docker-compose-validation
      - frontend-security-lint
    if: always()
    steps:
      - name: Print Security Summary
        run: |
          echo "## 🔒 Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Scan | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Python Dependencies | ${{ needs.python-dependencies.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Node.js Dependencies | ${{ needs.node-dependencies.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Image | ${{ needs.docker-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Detection | ${{ needs.secret-detection.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SAST (Bandit) | ${{ needs.sast-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Compose | ${{ needs.docker-compose-validation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend Lint | ${{ needs.frontend-security-lint.result }} |" >> $GITHUB_STEP_SUMMARY
