<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wazuh 告警流测试</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .header {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        .stat-card h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
            color: #666;
        }
        .stat-card .number {
            font-size: 32px;
            font-weight: bold;
        }
        .critical { color: #dc2626; }
        .high { color: #f97316; }
        .medium { color: #eab308; }
        .low { color: #3b82f6; }
        .info { color: #6b7280; }

        .controls {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
        }
        .btn-primary { background: #3b82f6; color: white; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-warning { background: #f97316; color: white; }
        .btn-success { background: #22c55e; color: white; }
        .btn-secondary { background: #6b7280; color: white; }
        button:hover { opacity: 0.9; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .alerts {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .alert-item {
            padding: 15px;
            border-left: 4px solid #ccc;
            margin-bottom: 10px;
            background: #f9f9f9;
            border-radius: 4px;
        }
        .alert-item.critical { border-left-color: #dc2626; background: #fef2f2; }
        .alert-item.high { border-left-color: #f97316; background: #fff7ed; }
        .alert-item.medium { border-left-color: #eab308; background: #fefce8; }
        .alert-item.low { border-left-color: #3b82f6; background: #eff6ff; }
        .alert-item.info { border-left-color: #6b7280; background: #f3f4f6; }

        .alert-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .alert-title {
            font-weight: bold;
            font-size: 16px;
        }
        .alert-time {
            font-size: 12px;
            color: #666;
        }
        .alert-details {
            font-size: 14px;
            color: #333;
        }
        .alert-meta {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #eee;
            font-size: 12px;
            color: #666;
            display: flex;
            gap: 15px;
        }
        .badge {
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
        }
        .badge-critical { background: #dc2626; color: white; }
        .badge-high { background: #f97316; color: white; }
        .badge-medium { background: #eab308; color: black; }
        .badge-low { background: #3b82f6; color: white; }
        .badge-info { background: #6b7280; color: white; }

        .status {
            padding: 10px 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .status.connected { background: #dcfce7; color: #166534; }
        .status.disconnected { background: #fee2e2; color: #991b1b; }
        .status.loading { background: #fef3c7; color: #92400e; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎯 Wazuh 实时告警流测试</h1>
        <p>Week 1 实时告警流功能测试页面</p>
        <div id="status" class="status loading">⏳ 初始化中...</div>
    </div>

    <div class="stats">
        <div class="stat-card">
            <h3>总计</h3>
            <div class="number" id="total">0</div>
        </div>
        <div class="stat-card">
            <h3>Critical</h3>
            <div class="number critical" id="critical">0</div>
        </div>
        <div class="stat-card">
            <h3>High</h3>
            <div class="number high" id="high">0</div>
        </div>
        <div class="stat-card">
            <h3>Medium</h3>
            <div class="number medium" id="medium">0</div>
        </div>
        <div class="stat-card">
            <h3>Low</h3>
            <div class="number low" id="low">0</div>
        </div>
        <div class="stat-card">
            <h3>Info</h3>
            <div class="number info" id="info">0</div>
        </div>
    </div>

    <div class="controls">
        <button class="btn-danger" onclick="sendAlert('critical')">发送 Critical</button>
        <button class="btn-warning" onclick="sendAlert('high')">发送 High</button>
        <button class="btn-primary" onclick="sendAlert('medium')">发送 Medium</button>
        <button class="btn-success" onclick="sendAlert('low')">发送 Low</button>
        <button class="btn-secondary" onclick="sendMultiple()">发送多个</button>
        <button class="btn-secondary" onclick="clearAlerts()">清空</button>
        <button class="btn-primary" onclick="fetchHistory()">获取历史</button>
    </div>

    <div class="alerts">
        <h2>实时告警列表</h2>
        <div id="alertList"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';
        let alerts = [];
        let token = null;

        // 获取 token
        function getToken() {
            // 从 localStorage 获取（如果在浏览器中）
            const stored = localStorage.getItem('token');
            if (stored) return stored;

            // 使用默认测试 token
            return 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJlMDc3MzMwYS1iZDEzLTRhMzYtOWRjOS1hMWMwNjM0ZjY5MjAiLCJyb2xlIjoiYWRtaW4iLCJleHAiOjE3NzIwNTIxMjEsInR5cGUiOiJhY2Nlc3MifQ.XhIvanJOpy2nEL8tOdSjJIQLVHDifq9JqhqwV6S7b8U';
        }

        // 更新状态
        function updateStatus(type, message) {
            const status = document.getElementById('status');
            status.className = `status ${type}`;
            status.textContent = message;
        }

        // 更新统计
        function updateStats() {
            const stats = {
                total: alerts.length,
                critical: alerts.filter(a => a.severity === 'critical').length,
                high: alerts.filter(a => a.severity === 'high').length,
                medium: alerts.filter(a => a.severity === 'medium').length,
                low: alerts.filter(a => a.severity === 'low').length,
                info: alerts.filter(a => a.severity === 'info').length
            };

            for (const [key, value] of Object.entries(stats)) {
                document.getElementById(key).textContent = value;
            }
        }

        // 渲染告警
        function renderAlerts() {
            const container = document.getElementById('alertList');

            if (alerts.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #999; padding: 40px;">暂无告警</p>';
                return;
            }

            container.innerHTML = alerts.map(alert => `
                <div class="alert-item ${alert.severity}">
                    <div class="alert-header">
                        <div class="alert-title">${alert.title || alert.event_type || '未知告警'}</div>
                        <div class="alert-time">${new Date(alert.timestamp).toLocaleString()}</div>
                    </div>
                    <div class="alert-details">
                        ${alert.description || alert.full_log || '无详细信息'}
                    </div>
                    <div class="alert-meta">
                        <span class="badge badge-${alert.severity}">${alert.severity.toUpperCase()}</span>
                        <span>📡 Agent: ${alert.agent?.name || alert.agent?.id || 'N/A'}</span>
                        <span>🌐 IP: ${alert.source_ip || 'N/A'}</span>
                        <span>⚠️ 风险评分: ${alert.risk_score || 'N/A'}</span>
                    </div>
                    ${alert.mitre && alert.mitre.tactic ? `
                        <div class="alert-meta">
                            <span>🎯 MITRE: ${Array.isArray(alert.mitre.tactic) ? alert.mitre.tactic.join(', ') : alert.mitre.tactic}</span>
                        </div>
                    ` : ''}
                    ${alert.iocs && alert.iocs.length > 0 ? `
                        <div class="alert-meta">
                            <span>🔍 IOCs: ${alert.iocs.join(', ')}</span>
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        // 发送测试告警
        async function sendAlert(severity) {
            const eventTypes = {
                critical: 'ransomware',
                high: 'ssh_bruteforce',
                medium: 'malware',
                low: 'scan_attempt'
            };

            try {
                updateStatus('loading', `发送 ${severity.toUpperCase()} 告警中...`);

                const response = await fetch(`${API_BASE}/api/v1/wazuh/stream/test-alert`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${getToken()}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        agent_id: '001',
                        severity: severity,
                        event_type: eventTypes[severity],
                        count: 1
                    })
                });

                const data = await response.json();

                if (data.success) {
                    updateStatus('connected', `✅ 成功发送 ${data.alerts_sent} 个告警`);
                    // 延迟获取历史告警
                    setTimeout(fetchHistory, 500);
                } else {
                    updateStatus('disconnected', `❌ 发送失败: ${JSON.stringify(data)}`);
                }
            } catch (error) {
                updateStatus('disconnected', `❌ 请求失败: ${error.message}`);
            }
        }

        // 发送多个告警
        async function sendMultiple() {
            const severities = ['critical', 'high', 'medium', 'low'];
            updateStatus('loading', '发送多个告警中...');

            for (const severity of severities) {
                await sendAlert(severity);
                await new Promise(resolve => setTimeout(resolve, 200));
            }

            setTimeout(fetchHistory, 1000);
        }

        // 获取历史告警
        async function fetchHistory() {
            try {
                const response = await fetch(`${API_BASE}/api/v1/wazuh/stream/history?limit=20`, {
                    headers: {
                        'Authorization': `Bearer ${getToken()}`
                    }
                });

                const data = await response.json();

                if (Array.isArray(data)) {
                    alerts = data;
                    renderAlerts();
                    updateStats();
                    updateStatus('connected', `✅ 已加载 ${alerts.length} 个告警`);
                } else {
                    updateStatus('disconnected', '❌ 获取历史失败');
                }
            } catch (error) {
                updateStatus('disconnected', `❌ 获取失败: ${error.message}`);
            }
        }

        // 清空告警
        function clearAlerts() {
            alerts = [];
            renderAlerts();
            updateStats();
            updateStatus('connected', '✅ 已清空告警列表');
        }

        // 页面加载时初始化
        window.addEventListener('load', () => {
            console.log('🎯 Wazuh 告警流测试页面已加载');

            // 检查服务状态
            fetch(`${API_BASE}/api/health`)
                .then(r => r.json())
                .then(data => {
                    if (data.status === 'ok') {
                        updateStatus('connected', '✅ 后端服务已连接');
                        fetchHistory();
                    } else {
                        updateStatus('disconnected', '❌ 后端服务异常');
                    }
                })
                .catch(error => {
                    updateStatus('disconnected', '❌ 无法连接后端服务');
                });
        });
    </script>
</body>
</html>
