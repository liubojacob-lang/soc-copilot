# Production Docker Compose Configuration
# Usage: docker-compose -f docker-compose.prod.yml up -d

services:
  postgres:
    image: postgres:15-alpine
    container_name: soc-copilot-postgres-prod
    environment:
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./backups:/backups
    ports:
      - "127.0.0.1:5432:5432" # Only bind to localhost for security
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "max_connections=200"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - soc-copilot-prod
    restart: always

  redis:
    image: redis:7-alpine
    container_name: soc-copilot-redis-prod
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_prod_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - soc-copilot-prod
    restart: always

  backend:
    image: ${DOCKERHUB_USERNAME}/soc-copilot-backend:${IMAGE_TAG:-0.9.4}
    container_name: soc-copilot-backend-prod
    environment:
      - "DATABASE_URL=postgresql+asyncpg://${DB_USER:?DB_USER is required}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/${DB_NAME:?DB_NAME is required}"
      - "DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}"
      - "REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0"
      - "REDIS_ENABLED=true"
      - "REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
      - "JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}"
      - "BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD is required}"
      - "SECRET_ENCRYPTION_KEY=${SECRET_ENCRYPTION_KEY:?SECRET_ENCRYPTION_KEY is required}"
      - "HTTP_ALLOWED_HOSTS=${HTTP_ALLOWED_HOSTS:?HTTP_ALLOWED_HOSTS is required}"
      - "CORS_ORIGINS=${CORS_ORIGINS:?CORS_ORIGINS is required}"
      - "ENVIRONMENT=production"
      - "METRICS_TOKEN=${METRICS_TOKEN:-}"
      - "DIFY_API_URL=${DIFY_API_URL}"
      - "DIFY_API_KEY=${DIFY_API_KEY}"
      - "LOG_LEVEL=INFO"
      - "WORKERS=4"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - soc-copilot-prod
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  frontend:
    image: ${DOCKERHUB_USERNAME}/soc-copilot-frontend:${IMAGE_TAG:-0.9.4}
    container_name: soc-copilot-frontend-prod
    environment:
      - NEXT_PUBLIC_API_URL=${API_URL}
      - NODE_ENV=production
    networks:
      - soc-copilot-prod
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  nginx:
    image: nginx:alpine
    container_name: soc-copilot-nginx-prod
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
      # ACME HTTP-01 challenge webroot (nginx.conf serves /.well-known/acme-challenge)
      - ./nginx/certbot-www:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    networks:
      - soc-copilot-prod
    restart: always

  # TLS 证书签发/续期。首次签发（需真实域名解析到本机）：
  #   docker compose -f docker-compose.prod.yml run --rm certbot certonly \
  #     --webroot -w /var/www/certbot -d "$DOMAIN" --email "$LETSENCRYPT_EMAIL" \
  #     --agree-tos --no-eff-email
  # 然后重启 nginx 加载 ./nginx/ssl 下生成的证书。
  certbot:
    image: certbot/certbot
    container_name: soc-copilot-certbot-prod
    profiles: ["tls"] # 仅按需运行：docker compose --profile tls run --rm certbot renew
    volumes:
      - ./nginx/ssl:/etc/letsencrypt
      - ./nginx/certbot-www:/var/www/certbot
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'
    networks:
      - soc-copilot-prod

  alert-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Note: container_name removed to support replicas (unique names auto-generated)
    command: python workers/alert_worker.py
    environment:
      - "REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0"
      - WORKER_ID=${WORKER_ID:-1}
      - FEISHU_WEBHOOK_URL=${FEISHU_WEBHOOK_URL}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO}
      - SMTP_SERVER=${SMTP_SERVER:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SOC_BASE_URL=${SOC_BASE_URL:-https://localhost}
      - LOG_LEVEL=INFO
    depends_on:
      redis:
        condition: service_healthy
    # The backend image ships an HTTP healthcheck that a worker can never
    # satisfy; ping Redis as the worker's functional check instead.
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import os, redis; redis.Redis.from_url(os.environ['REDIS_URL']).ping()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - soc-copilot-prod
    restart: always
    deploy:
      mode: replicated
      replicas: 3 # 水平扩展：3个 Worker 实例
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 128M

volumes:
  postgres_prod_data:
  redis_prod_data:

networks:
  soc-copilot-prod:
    driver: bridge
