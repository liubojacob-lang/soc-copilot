# Ruff configuration for SOC Copilot backend
# https://docs.astral.sh/ruff/

# Target Python version
target-version = "py312"

# Line length
line-length = 100

# Exclude patterns
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.egg-info",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    "migrations_alembic",
    "data",
    # standalone ops scripts provisioned out-of-band (root-owned), not app runtime code
    "security-modules",
]

# Source directories
src = ["."]

[lint]
# Enable rules
select = [
    "E",      # pycodestyle errors
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented-out code)
    "RUF",    # Ruff-specific rules
]

# Ignore specific rules
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B904",   # raise without from inside except
    "ARG001", # unused function argument (common in FastAPI dependencies)
    "ARG002", # unused method argument
    "ARG003", # unused keyword argument (same rationale as ARG001/2)
    "ARG004", # unused static method argument (same rationale as ARG001/2)
    "SIM108", # use ternary operator
    "ERA001", # commented-out code
    # --- curated for this codebase, revisit after launch ---
    "E402",   # module import not at top (optional-dependency imports after env setup)
    "E712",   # == True/False (required idiom for SQLAlchemy column expressions)
    "RUF001", # ambiguous unicode in string (zh-CN product strings are intentional)
    "RUF002", # ambiguous unicode in comment (zh-CN comments are intentional)
    # --- mass legacy refactors, tracked for post-1.0 (T-ruff-backlog) ---
    # UP042: (str, Enum) -> StrEnum across ~49 classes; mechanical but touches
    #        serialization-adjacent enums, not a release-weekend change
    "UP042",
    # UP046/UP047: PEP 695 generics (class Foo[T]) across TypedDict/Generic helpers
    "UP046",
    "UP047",
    "RUF003", # ambiguous unicode in docstring (zh-CN docstrings are intentional)
    "RUF006", # asyncio dangling task (needs task-ref rework, tracked as tech debt)
    "RUF012", # mutable class default (needs ClassVar audit)
    "RUF013", # implicit Optional (bulk annotation churn, not launch-blocking)
    "SIM102", # collapsible-if (stylistic rewrite churn, not launch-blocking)
    "SIM105", # suppressible-exception (try/except vs contextlib.suppress, stylistic)
    "SIM116", # if-else vs dict lookup (stylistic rewrite churn)
    "SIM117", # multiple-with (stylistic rewrite churn)
    "TC001",  # typing-only first-party import (conflicts with pydantic runtime use)
    "TC002",  # typing-only third-party import (same)
    "TC003",  # typing-only stdlib import (same)
    "PTH",    # os.path -> pathlib (stylistic churn, not launch-blocking)
]

# Allow unused variables when prefixed with _
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.per-file-ignores]
"tests/*" = ["ARG", "S101", "PLR2004"]
"__init__.py" = ["F401"]

[lint.isort]
known-first-party = ["core", "models", "routers", "services", "middleware", "dependencies", "db", "schemas", "repositories"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
