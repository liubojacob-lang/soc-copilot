version: '3.8'

# This file adds the Wazuh API service to the existing SOC Copilot setup
# The Wazuh Manager is already running as 'soc-wazuh-manager'

services:
  # Wazuh API - New service
  wazuh-api:
    image: wazuh/wazuh-api:4.8.0
    container_name: soc-wazuh-api
    hostname: soc-wazuh-api
    restart: always
    depends_on:
      - wazuh-manager-link
    ports:
      - "55000:55000"
    environment:
      - WAZUH_MANAGER_URL=wazuh-manager-link
      - WAZUH_API_USER=wazuh-wui
      - WAZUH_API_PASSWORD=wazuh-ui-wazuh-wui
      - WAZUH_API_PORT=55000
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - /var/ossec/api/configuration
      - wazuh_etc_ossec:/var/ossec/etc:rw
    networks:
      - soc-copilot-network

  # Network alias for existing Wazuh Manager
  wazuh-manager-link:
    image: busybox
    container_name: wazuh-manager-link
    command: tail -f /dev/null
    network_mode: service:soc-wazuh-manager

volumes:
  wazuh_api_configuration:
    external: false
  wazuh_etc_ossec:
    external: false

networks:
  soc-copilot-network:
    external: true
    name: sec_soc-copilot-network
