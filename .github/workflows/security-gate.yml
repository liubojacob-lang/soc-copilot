# Security Gate — Required PR Check
# S0-21: Consolidates pip-audit, npm audit, and bandit as a PR-blocking gate.
# This workflow runs on every PR targeting master and is configured as a
# required status check in branch protection rules.

name: Security Gate (Required)

on:
  pull_request:
    branches: [master, "release/*"]
  push:
    branches: [master]

permissions:
  contents: read
  security-events: write

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/security-gate.yml'
              - '.github/scripts/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/security-gate.yml'
              - '.github/scripts/**'

  # ── Python Dependency Audit (pip-audit) ──
  pip-audit:
    name: pip-audit (Python Deps)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Run pip-audit
        id: audit
        working-directory: ./backend
        run: |
          set -o pipefail
          pip-audit --requirement=requirements.txt --format=json --output=pip-audit-report.json 2>&1 | tee pip-audit-output.txt
          # pip-audit exits non-zero when vulnerabilities are found;
          # the gate script decides whether the findings are blocking.
          python ../.github/scripts/check_pip_audit.py pip-audit-report.json

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-gate-report
          path: backend/pip-audit-report.json
          retention-days: 30

  # ── Frontend Dependency Audit (npm audit) ──
  npm-audit:
    name: npm audit (Frontend Deps)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        working-directory: ./frontend
        run: |
          set -o pipefail
          npm audit --json 2>&1 | tee npm-audit-output.json
          # npm audit exits non-zero when vulnerabilities are found;
          # the gate script decides whether the findings are blocking.
          python ../.github/scripts/check_npm_audit.py npm-audit-output.json

  # ── Python SAST (Bandit) ──
  bandit:
    name: Bandit SAST (Python)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit (high-severity only)
        id: bandit
        working-directory: ./backend
        run: |
          set -o pipefail
          bandit -r . -f json -o bandit-gate-report.json -ll 2>&1 || true
          # The gate script decides which findings are blocking.
          python ../.github/scripts/check_bandit.py bandit-gate-report.json

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-gate-report
          path: backend/bandit-gate-report.json
          retention-days: 30

  # ── Gate Summary ──
  security-gate-summary:
    name: Security Gate Summary
    runs-on: ubuntu-latest
    needs: [pip-audit, npm-audit, bandit]
    if: always()
    steps:
      - name: Report gate status
        run: |
          echo "## 🔒 Security Gate Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| pip-audit (Python Deps) | ${{ needs.pip-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| npm audit (Frontend Deps) | ${{ needs.npm-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Bandit SAST (Python) | ${{ needs.bandit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note**: This gate is configured as a required PR check. All three scans must pass before merging." >> $GITHUB_STEP_SUMMARY

          # Fail the summary only when a scan actually ran and failed.
          # Path-filtered runs skip the audit jobs (result: "skipped") when
          # no backend/frontend files changed — that is a pass, not a failure.
          if [ "${{ needs.pip-audit.result }}" = "failure" ] ||             [ "${{ needs.pip-audit.result }}" = "cancelled" ] ||             [ "${{ needs.npm-audit.result }}" = "failure" ] ||             [ "${{ needs.npm-audit.result }}" = "cancelled" ] ||             [ "${{ needs.bandit.result }}" = "failure" ] ||             [ "${{ needs.bandit.result }}" = "cancelled" ]; then
            echo "❌ Security gate FAILED — please fix the issues above before merging."
            exit 1
          fi
          echo "✅ Security gate PASSED — all checks clear."
