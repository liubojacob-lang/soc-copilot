# Development Environment Override
# This file is automatically loaded by docker-compose in development mode
# Usage: docker-compose up -d (automatically includes this file)

services:
  # Backend - Development mode with hot reload
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m uvicorn main:app --reload --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"  # Expose for direct access during development
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      - CORS_ORIGINS=["http://localhost:3003","http://127.0.0.1:3003"]
    volumes:
      - ./backend:/app
      - /app/__pycache__
    networks:
      - frontend-net  # Allow direct access in development
      - backend-net
      - database-net

  # Frontend - Use production build from Dockerfile
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    networks:
      - frontend-net
      - backend-net  # Allow direct API access

  # Redis - Keep password for backend compatibility
  redis:
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required} --loglevel warning
    ports:
      - "6379:6379"  # Expose for local debugging

  # Postgres - Expose for local database tools
  postgres:
    ports:
      - "5432:5432"
