# Wazuh Docker Compose Configuration
# Version: 4.8.0

version: '3.8'

services:
  # Wazuh Indexer (OpenSearch)
  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.8.0
    container_name: wazuh.indexer
    hostname: wazuh.indexer
    restart: unless-stopped
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=false
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=ChangeThisPassword123!
    volumes:
      - wazuh-indexer-data:/var/lib/opensearch
    networks:
      - wazuh-net
    healthcheck:
      test: ["CMD-SHELL", "curl -k -u admin:ChangeThisPassword123! https://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Wazuh Manager
  wazuh.manager:
    image: wazuh/wazuh-manager:4.8.0
    container_name: wazuh.manager
    hostname: wazuh.manager
    restart: unless-stopped
    depends_on:
      wazuh.indexer:
        condition: service_healthy
    ports:
      - "1514:1514"
      - "1515:1515"
      - "1516:1516"
      - "55000:55000"
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=ChangeThisPassword123!
      - FILEBEAT_PASSWORD=FilebeatPassword123!
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=wazuh-wui-password
      - WAZUH_EMAIL=wazuh@example.com
    volumes:
      - wazuh-manager-data:/var/ossec/data
    networks:
      - wazuh-net
    healthcheck:
      test: ["CMD-SHELL", "curl -k https://localhost:55000/healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Wazuh Dashboard
  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.8.0
    container_name: wazuh.dashboard
    hostname: wazuh.dashboard
    restart: unless-stopped
    depends_on:
      wazuh.indexer:
        condition: service_healthy
      wazuh.manager:
        condition: service_healthy
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_URL=https://wazuh.indexer:9200
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=ChangeThisPassword123!
      - WAZUH_API_URL=https://wazuh.manager:55000
      - WAZUH_API_USERNAME=wazuh-wui
      - WAZUH_API_PASSWORD=wazuh-wui-password
    networks:
      - wazuh-net
    healthcheck:
      test: ["CMD-SHELL", "curl -k https://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

networks:
  wazuh-net:
    driver: bridge
    name: wazuh-net

volumes:
  wazuh-indexer-data:
    name: wazuh-indexer-data
  wazuh-manager-data:
    name: wazuh-manager-data
