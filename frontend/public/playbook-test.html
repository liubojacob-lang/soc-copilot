<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOC Copilot v0.6.1 - Playbook 测试工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .result-card {
            max-height: 400px;
            overflow-y: auto;
        }
        .step-success { border-left: 4px solid #10b981; }
        .step-failed { border-left: 4px solid #ef4444; }
        .step-skipped { border-left: 4px solid #f59e0b; }
        .step-running { border-left: 4px solid #3b82f6; }
        pre { white-space: pre-wrap; word-wrap: break-word; }
        .animate-pulse-slow { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-7xl">
        <!-- Header -->
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-blue-400 mb-2">SOC Copilot v0.6.1</h1>
            <h2 class="text-xl text-gray-400">Playbook Execution Engine 测试工具</h2>
        </header>

        <!-- API Configuration -->
        <div class="bg-gray-800 rounded-lg p-4 mb-6">
            <h3 class="text-lg font-semibold mb-3 text-blue-300">API 配置</h3>
            <div class="flex items-center gap-4">
                <div class="flex-1">
                    <label class="block text-sm text-gray-400 mb-1">API 地址</label>
                    <input type="text" id="apiUrl" value="http://localhost:8000"
                           class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded focus:border-blue-500 focus:outline-none">
                </div>
                <button onclick="testConnection()"
                        class="px-4 py-2 bg-blue-600 hover:bg-blue-700 rounded font-medium transition">
                    测试连接
                </button>
            </div>
            <div id="connectionStatus" class="mt-2 text-sm"></div>
        </div>

        <!-- Quick Test Buttons -->
        <div class="bg-gray-800 rounded-lg p-4 mb-6">
            <h3 class="text-lg font-semibold mb-3 text-blue-300">快速测试</h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                <button onclick="runQuickTest('phishing_basic')"
                        class="px-4 py-3 bg-green-600 hover:bg-green-700 rounded font-medium transition">
                    📧 钓鱼邮件 - 基础测试
                </button>
                <button onclick="runQuickTest('phishing_ioc')"
                        class="px-4 py-3 bg-green-600 hover:bg-green-700 rounded font-medium transition">
                    🦠 钓鱼邮件 - IOC 提取
                </button>
                <button onclick="runQuickTest('endpoint_malware')"
                        class="px-4 py-3 bg-orange-600 hover:bg-orange-700 rounded font-medium transition">
                    💻 终端恶意软件
                </button>
                <button onclick="runQuickTest('suspicious_login')"
                        class="px-4 py-3 bg-purple-600 hover:bg-purple-700 rounded font-medium transition">
                    🔐 可疑登录
                </button>
                <button onclick="runQuickTest('full_phishing')"
                        class="px-4 py-3 bg-red-600 hover:bg-red-700 rounded font-medium transition">
                    🎯 完整流程测试
                </button>
                <button onclick="runQuickTest('apply_mode')"
                        class="px-4 py-3 bg-indigo-600 hover:bg-indigo-700 rounded font-medium transition">
                    ⚡ Apply 模式
                </button>
            </div>
        </div>

        <!-- Custom Test -->
        <div class="bg-gray-800 rounded-lg p-4 mb-6">
            <h3 class="text-lg font-semibold mb-3 text-blue-300">自定义测试</h3>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <!-- Playbook Selection -->
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Playbook</label>
                    <select id="playbookSelect"
                            class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded focus:border-blue-500 focus:outline-none">
                        <option value="phishing_triage">钓鱼邮件分析</option>
                        <option value="endpoint_malware_triage">终端恶意软件分析</option>
                        <option value="suspicious_login_triage">可疑登录分析</option>
                    </select>
                </div>

                <!-- Mode Selection -->
                <div>
                    <label class="block text-sm text-gray-400 mb-1">执行模式</label>
                    <select id="modeSelect"
                            class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded focus:border-blue-500 focus:outline-none">
                        <option value="dry_run">Dry Run (模拟执行)</option>
                        <option value="apply">Apply (实际执行)</option>
                    </select>
                </div>
            </div>

            <!-- Input Data -->
            <div class="mb-4">
                <label class="block text-sm text-gray-400 mb-1">输入数据 (JSON)</label>
                <textarea id="inputData" rows="6"
                          class="w-full px-3 py-2 bg-gray-700 border border-gray-600 rounded focus:border-blue-500 focus:outline-none font-mono text-sm"
                          placeholder='{"alert_data": {"subject": "测试"}}'></textarea>
            </div>

            <!-- Test Data Templates -->
            <div class="mb-4">
                <label class="block text-sm text-gray-400 mb-2">测试数据模板</label>
                <div class="flex flex-wrap gap-2">
                    <button onclick="loadTemplate('basic')"
                            class="px-3 py-1 bg-gray-700 hover:bg-gray-600 rounded text-sm transition">
                        基础
                    </button>
                    <button onclick="loadTemplate('ioc_ip')"
                            class="px-3 py-1 bg-gray-700 hover:bg-gray-600 rounded text-sm transition">
                        IP地址
                    </button>
                    <button onclick="loadTemplate('ioc_domain')"
                            class="px-3 py-1 bg-gray-700 hover:bg-gray-600 rounded text-sm transition">
                        域名
                    </button>
                    <button onclick="loadTemplate('ioc_url')"
                            class="px-3 py-1 bg-gray-700 hover:bg-gray-600 rounded text-sm transition">
                        URL
                    </button>
                    <button onclick="loadTemplate('ioc_hash')"
                            class="px-3 py-1 bg-gray-700 hover:bg-gray-600 rounded text-sm transition">
                        哈希
                    </button>
                    <button onclick="loadTemplate('ioc_all')"
                            class="px-3 py-1 bg-gray-700 hover:bg-gray-600 rounded text-sm transition">
                        全部IOC
                    </button>
                    <button onclick="loadTemplate('malware')"
                            class="px-3 py-1 bg-gray-700 hover:bg-gray-600 rounded text-sm transition">
                        恶意软件
                    </button>
                    <button onclick="loadTemplate('login')"
                            class="px-3 py-1 bg-gray-700 hover:bg-gray-600 rounded text-sm transition">
                        可疑登录
                    </button>
                </div>
            </div>

            <button onclick="runCustomTest()"
                    class="w-full px-4 py-3 bg-blue-600 hover:bg-blue-700 rounded font-medium transition flex items-center justify-center gap-2">
                <span id="runIcon">▶️</span>
                <span id="runButtonText">执行 Playbook</span>
            </button>
        </div>

        <!-- Results Section -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Execution Status -->
            <div class="bg-gray-800 rounded-lg p-4">
                <h3 class="text-lg font-semibold mb-3 text-blue-300">执行状态</h3>
                <div id="executionStatus" class="space-y-3">
                    <div class="text-gray-400 text-center py-8">
                        点击上方按钮执行测试...
                    </div>
                </div>
            </div>

            <!-- Output -->
            <div class="bg-gray-800 rounded-lg p-4">
                <h3 class="text-lg font-semibold mb-3 text-blue-300">输出结果</h3>
                <div id="outputResult" class="result-card">
                    <pre class="text-sm text-gray-400">执行结果将显示在这里...</pre>
                </div>
            </div>
        </div>

        <!-- Run History -->
        <div class="bg-gray-800 rounded-lg p-4 mt-6">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-lg font-semibold text-blue-300">运行历史</h3>
                <button onclick="loadRunHistory()"
                        class="px-3 py-1 bg-gray-700 hover:bg-gray-600 rounded text-sm transition">
                    🔄 刷新
                </button>
            </div>
            <div id="runHistory" class="space-y-2">
                <div class="text-gray-400 text-center py-4">
                    点击刷新按钮加载历史记录...
                </div>
            </div>
        </div>

        <!-- Statistics -->
        <div class="bg-gray-800 rounded-lg p-4 mt-6">
            <h3 class="text-lg font-semibold mb-3 text-blue-300">统计信息</h3>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="bg-gray-700 rounded-lg p-4 text-center">
                    <div class="text-3xl font-bold text-green-400" id="statTotal">0</div>
                    <div class="text-sm text-gray-400">总执行次数</div>
                </div>
                <div class="bg-gray-700 rounded-lg p-4 text-center">
                    <div class="text-3xl font-bold text-green-400" id="statSuccess">0</div>
                    <div class="text-sm text-gray-400">成功</div>
                </div>
                <div class="bg-gray-700 rounded-lg p-4 text-center">
                    <div class="text-3xl font-bold text-red-400" id="statFailed">0</div>
                    <div class="text-sm text-gray-400">失败</div>
                </div>
                <div class="bg-gray-700 rounded-lg p-4 text-center">
                    <div class="text-3xl font-bold text-yellow-400" id="statAvgDuration">0ms</div>
                    <div class="text-sm text-gray-400">平均耗时</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let API_URL = 'http://localhost:8000';
        let currentRunId = null;

        // Test Data Templates
        const templates = {
            basic: {
                alert_data: {
                    subject: "Test Alert"
                }
            },
            ioc_ip: {
                alert_data: {
                    subject: "Security Alert: Suspicious activity detected from 192.168.1.100",
                    sender: "security@company.com"
                },
                description: "Multiple login attempts detected from internal IP"
            },
            ioc_domain: {
                alert_data: {
                    subject: "Phishing: Verify your account at evil.com immediately",
                    sender: "support@evil.com"
                },
                source_text: "Click here: http://evil.com/verify"
            },
            ioc_url: {
                alert_data: {
                    subject: "Urgent: Download attached file from http://malicious-site.com/file.exe"
                },
                body: "Visit http://phishing-site.com/login to verify"
            },
            ioc_hash: {
                alert_data: {
                    subject: "Malware detected with hash 5d41402abc4b2a76b9719d911017c592"
                },
                file_path: "C:\\Users\\victim\\Downloads\\suspicious.exe"
            },
            ioc_all: {
                alert_data: {
                    subject: "URGENT: Transfer funds to 192.168.1.100 via evil.com",
                    sender: "ceo@evil.com"
                },
                source_text: "Visit http://evil-phishing.com/confirm?token=abc123",
                body: "File attachment SHA256: a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8g9h0i1j2",
                description: "From IP 10.0.0.15 to attacker@hacker.com"
            },
            malware: {
                alert_data: {
                    subject: "MALWARE DETECTED: Trojan.Generic.12345 on workstation",
                    hostname: "PC-FINANCE-001",
                    file_path: "C:\\Users\\john.doe\\Downloads\\invoice.exe",
                    file_hash: "44445555666677778888999aaabbbcccdddeee",
                    detection_time: "2024-01-15T10:30:00Z"
                },
                source: "EDR Endpoint Protection",
                severity: "critical"
            },
            login: {
                alert_data: {
                    subject: "ALERT: Suspicious login from unknown location",
                    username: "john.doe@company.com",
                    source_ip: "203.0.113.5",
                    login_time: "2024-01-15T03:25:00Z",
                    location: "Unknown Location (possibly China)",
                    device: "Windows 10 Pro"
                },
                source: "Identity Provider",
                risk_score: 75
            }
        };

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadRunHistory();
            testConnection();
        });

        function getApiUrl() {
            API_URL = document.getElementById('apiUrl').value;
            return API_URL;
        }

        async function testConnection() {
            const url = getApiUrl();
            const statusDiv = document.getElementById('connectionStatus');

            try {
                statusDiv.innerHTML = '<span class="text-yellow-400">测试中...</span>';

                const response = await fetch(`${url}/api/health`);

                if (response.ok) {
                    const data = await response.json();
                    statusDiv.innerHTML = `<span class="text-green-400">✓ 连接成功 (${data.status})</span>`;
                    loadRunHistory();
                    updateStatistics();
                } else {
                    statusDiv.innerHTML = `<span class="text-red-400">✗ 连接失败 (${response.status})</span>`;
                }
            } catch (error) {
                statusDiv.innerHTML = `<span class="text-red-400">✗ 无法连接: ${error.message}</span>`;
            }
        }

        function loadTemplate(templateName) {
            const template = templates[templateName];
            if (template) {
                document.getElementById('inputData').value = JSON.stringify(template, null, 2);
            }
        }

        async function runQuickTest(testType) {
            const testData = getQuickTestData(testType);
            const url = getApiUrl();

            await executePlaybook(url, testData.playbook, testData.mode, testData.input);
        }

        function getQuickTestData(testType) {
            const testCases = {
                phishing_basic: {
                    playbook: 'phishing_triage',
                    mode: 'dry_run',
                    input: templates.basic
                },
                phishing_ioc: {
                    playbook: 'phishing_triage',
                    mode: 'dry_run',
                    input: templates.ioc_all
                },
                endpoint_malware: {
                    playbook: 'endpoint_malware_triage',
                    mode: 'dry_run',
                    input: templates.malware
                },
                suspicious_login: {
                    playbook: 'suspicious_login_triage',
                    mode: 'dry_run',
                    input: templates.login
                },
                full_phishing: {
                    playbook: 'phishing_triage',
                    mode: 'dry_run',
                    input: {
                        alert_data: {
                            subject: "SUSPICIOUS EMAIL: Your account will be locked - verify now at evil.com",
                            sender: "security-alert@evil.com",
                            from_ip: "203.0.113.45"
                        },
                        source_text: "Email contains link to http://evil-phishing-site.com/verify-account",
                        body: "Download attachment: suspicious_document.pdf (SHA256: e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855)"
                    }
                },
                apply_mode: {
                    playbook: 'phishing_triage',
                    mode: 'apply',
                    input: templates.ioc_all
                }
            };

            return testCases[testType];
        }

        async function runCustomTest() {
            const url = getApiUrl();
            const playbook = document.getElementById('playbookSelect').value;
            const mode = document.getElementById('modeSelect').value;

            let inputData;
            try {
                inputData = JSON.parse(document.getElementById('inputData').value);
            } catch (e) {
                showError('输入数据格式错误: ' + e.message);
                return;
            }

            await executePlaybook(url, playbook, mode, inputData);
        }

        async function executePlaybook(url, playbook, mode, inputData) {
            setRunningState(true);

            try {
                // Show execution started
                showStatus('开始执行...', 'running');

                const startTime = Date.now();

                const response = await fetch(`${url}/api/playbook/run`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        playbook_name: playbook,
                        mode: mode,
                        input_json: inputData
                    })
                });

                const endTime = Date.now();
                const duration = endTime - startTime;

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const result = await response.json();
                currentRunId = result.id;

                // Show complete result
                showExecutionResult(result, duration);

                // Poll for steps completion
                await pollForSteps(result.id, url);

                // Update statistics
                updateStatistics();

            } catch (error) {
                showError('执行失败: ' + error.message);
            } finally {
                setRunningState(false);
            }
        }

        async function pollForSteps(runId, url) {
            const maxAttempts = 30;
            let attempts = 0;

            while (attempts < maxAttempts) {
                attempts++;

                try {
                    const response = await fetch(`${url}/api/playbook/runs/${runId}/steps`);

                    if (!response.ok) {
                        console.error('Failed to fetch steps');
                        return;
                    }

                    const data = await response.json();

                    if (data.steps && data.steps.length > 0) {
                        displaySteps(data.steps);

                        // Check if all steps are complete
                        const allComplete = data.steps.every(step =>
                            step.status === 'success' ||
                            step.status === 'failed' ||
                            step.status === 'skipped'
                        );

                        if (allComplete) {
                            showStatus('执行完成', 'success');
                            loadRunHistory();
                            return;
                        }
                    }

                    await sleep(500);

                } catch (error) {
                    console.error('Error polling steps:', error);
                    await sleep(1000);
                }
            }
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('executionStatus');
            const colors = {
                running: 'text-blue-400',
                success: 'text-green-400',
                error: 'text-red-400'
            };

            statusDiv.innerHTML = `<div class="${colors[type]}">${message}</div>`;
        }

        function displaySteps(steps) {
            const statusDiv = document.getElementById('executionStatus');
            const icons = {
                success: '✅',
                failed: '❌',
                skipped: '⏭️',
                running: '⏳'
            };

            let html = '<div class="space-y-2">';

            steps.forEach((step, index) => {
                const statusClass = `step-${step.status}`;
                const icon = icons[step.status] || '⏳';

                html += `
                    <div class="bg-gray-700 rounded p-3 ${statusClass}">
                        <div class="flex items-center gap-2 mb-2">
                            <span>${icon}</span>
                            <span class="font-medium">步骤 ${index + 1}: ${step.step_name}</span>
                            <span class="text-xs text-gray-400 ml-auto">${step.duration_ms}ms</span>
                        </div>
                        <div class="text-sm text-gray-300">
                            <div class="text-xs text-gray-500">ID: ${step.step_id} | 状态: ${step.status}</div>
                        </div>
                    </div>
                `;
            });

            html += '</div>';
            statusDiv.innerHTML = html;
        }

        function showExecutionResult(result, duration) {
            const outputDiv = document.getElementById('outputResult');

            outputDiv.innerHTML = `
                <div class="space-y-4">
                    <div class="bg-gray-700 rounded p-3">
                        <h4 class="font-semibold text-green-400 mb-2">执行成功</h4>
                        <div class="text-sm space-y-1">
                            <div><span class="text-gray-400">Run ID:</span> ${result.id}</div>
                            <div><span class="text-gray-400">Playbook:</span> ${result.playbook_name}</div>
                            <div><span class="text-gray-400">模式:</span> ${result.mode}</div>
                            <div><span class="text-gray-400">状态:</span> ${result.status}</div>
                            <div><span class="text-gray-400">总耗时:</span> ${duration}ms</div>
                        </div>
                    </div>
                    <div class="bg-gray-700 rounded p-3">
                        <h4 class="font-semibold text-blue-400 mb-2">完整输出</h4>
                        <pre class="text-xs text-gray-300 overflow-x-auto">${JSON.stringify(result, null, 2)}</pre>
                    </div>
                </div>
            `;
        }

        function showError(message) {
            const outputDiv = document.getElementById('outputResult');
            outputDiv.innerHTML = `
                <div class="bg-red-900 border border-red-700 rounded p-4">
                    <div class="font-semibold text-red-400 mb-2">❌ 错误</div>
                    <div class="text-gray-300">${message}</div>
                </div>
            `;
            showStatus('执行失败', 'error');
        }

        function setRunningState(running) {
            const button = document.querySelector('#runButtonText');
            const icon = document.getElementById('runIcon');

            if (running) {
                button.textContent = '执行中...';
                icon.textContent = '⏳';
                document.getElementById('runButtonText').classList.add('animate-pulse-slow');
            } else {
                button.textContent = '执行 Playbook';
                icon.textContent = '▶️';
                document.getElementById('runButtonText').classList.remove('animate-pulse-slow');
            }
        }

        async function loadRunHistory() {
            const url = getApiUrl();
            const historyDiv = document.getElementById('runHistory');

            try {
                historyDiv.innerHTML = '<div class="text-gray-400 text-center py-4">加载中...</div>';

                const response = await fetch(`${url}/api/playbook/runs?limit=10`);

                if (!response.ok) {
                    throw new Error('Failed to load history');
                }

                const data = await response.json();

                if (data.items.length === 0) {
                    historyDiv.innerHTML = '<div class="text-gray-400 text-center py-4">暂无执行记录</div>';
                    return;
                }

                let html = '';
                data.items.forEach(run => {
                    const statusColors = {
                        success: 'text-green-400',
                        failed: 'text-red-400',
                        running: 'text-blue-400',
                        partial: 'text-yellow-400'
                    };
                    const statusColor = statusColors[run.status] || 'text-gray-400';

                    html += `
                        <div class="bg-gray-700 rounded p-3 hover:bg-gray-650 transition cursor-pointer" onclick="viewRunDetails('${run.id}')">
                            <div class="flex justify-between items-start mb-2">
                                <div>
                                    <div class="font-medium text-blue-300">${run.playbook_name}</div>
                                    <div class="text-xs text-gray-500 mt-1">ID: ${run.id.substring(0, 8)}...</div>
                                </div>
                                <span class="${statusColor} text-sm font-medium">${run.status}</span>
                            </div>
                            <div class="text-xs text-gray-400">
                                <div>模式: ${run.mode} | 步骤: ${run.output_json?.steps?.length || 0}</div>
                                <div>时间: ${run.started_at}</div>
                            </div>
                        </div>
                    `;
                });

                historyDiv.innerHTML = html;

            } catch (error) {
                historyDiv.innerHTML = `<div class="text-red-400">加载失败: ${error.message}</div>`;
            }
        }

        async function viewRunDetails(runId) {
            const url = getApiUrl();

            try {
                // Show run details
                const runResponse = await fetch(`${url}/api/playbook/runs/${runId}`);
                const run = await runResponse.json();

                // Show steps
                const stepsResponse = await fetch(`${url}/api/playbook/runs/${runId}/steps`);
                const stepsData = await stepsResponse.json();

                // Display in modal-like overlay
                showModal(run, stepsData.steps || stepsData.steps);

            } catch (error) {
                showError('加载详情失败: ' + error.message);
            }
        }

        function showModal(run, steps) {
            // Create modal overlay
            const modal = document.createElement('div');
            modal.id = 'detailModal';
            modal.className = 'fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50 p-4';
            modal.onclick = (e) => { if (e.target === modal) closeModal(); };

            let stepsHtml = '';
            steps.forEach((step, index) => {
                const statusIcons = { success: '✅', failed: '❌', skipped: '⏭️' };
                const icon = statusIcons[step.status] || '❓';

                stepsHtml += `
                    <div class="mb-3 last:mb-0">
                        <div class="flex items-center gap-2 mb-1">
                            <span>${icon}</span>
                            <span class="font-medium">步骤 ${index + 1}: ${step.step_name}</span>
                        </div>
                        <div class="text-sm text-gray-400 ml-6">
                            状态: ${step.status} | 耗时: ${step.duration_ms}ms
                        </div>
                    </div>
                `;
            });

            modal.innerHTML = `
                <div class="bg-gray-800 rounded-lg p-6 max-w-2xl w-full max-h-[80vh] overflow-y-auto" onclick="event.stopPropagation()">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-xl font-bold text-blue-400">执行详情</h3>
                        <button onclick="closeModal()" class="text-gray-400 hover:text-white text-2xl">&times;</button>
                    </div>

                    <div class="space-y-4">
                        <div>
                            <h4 class="font-semibold text-gray-300 mb-2">基本信息</h4>
                            <div class="bg-gray-700 rounded p-3 text-sm">
                                <div><span class="text-gray-400">Run ID:</span> ${run.id}</div>
                                <div><span class="text-gray-400">Playbook:</span> ${run.playbook_name} v${run.playbook_version}</div>
                                <div><span class="text-gray-400">模式:</span> ${run.mode}</div>
                                <div><span class="text-400">状态:</span> <span class="${run.status === 'success' ? 'text-green-400' : 'text-red-400'}">${run.status}</span></div>
                                <div><span class="text-gray-400">开始时间:</span> ${run.started_at}</div>
                                <div><span class="text-gray-400">完成时间:</span> ${run.finished_at || '进行中...'}</div>
                            </div>
                        </div>

                        <div>
                            <h4 class="font-semibold text-gray-300 mb-2">步骤执行</h4>
                            <div class="bg-gray-700 rounded p-3">
                                ${stepsHtml}
                            </div>
                        </div>

                        <div>
                            <h4 class="font-semibold text-gray-300 mb-2">完整输出</h4>
                            <div class="bg-gray-700 rounded p-3">
                                <pre class="text-xs text-gray-300 overflow-x-auto max-h-60">${JSON.stringify(run.output_json, null, 2)}</pre>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            document.body.appendChild(modal);
        }

        function closeModal() {
            const modal = document.getElementById('detailModal');
            if (modal) {
                modal.remove();
            }
        }

        async function updateStatistics() {
            const url = getApiUrl();

            try {
                const response = await fetch(`${url}/api/playbook/runs?limit=100`);

                if (!response.ok) {
                    return;
                }

                const data = await response.json();
                const runs = data.items || [];

                // Calculate statistics
                const total = runs.length;
                const success = runs.filter(r => r.status === 'success').length;
                const failed = runs.filter(r => r.status === 'failed').length;

                // Calculate average duration
                const completedRuns = runs.filter(r => r.started_at && r.finished_at);
                let avgDuration = 0;
                if (completedRuns.length > 0) {
                    const totalDuration = completedRuns.reduce((sum, run) => {
                        const start = new Date(run.started_at).getTime();
                        const end = new Date(run.finished_at).getTime();
                        return sum + (end - start);
                    }, 0);
                    avgDuration = Math.round(totalDuration / completedRuns.length);
                }

                // Update UI
                document.getElementById('statTotal').textContent = total;
                document.getElementById('statSuccess').textContent = success;
                document.getElementById('statFailed').textContent = failed;
                document.getElementById('statAvgDuration').textContent = avgDuration + 'ms';

            } catch (error) {
                console.error('Failed to update statistics:', error);
            }
        }

        // Expose functions globally
        window.testConnection = testConnection;
        window.runQuickTest = runQuickTest;
        window.runCustomTest = runCustomTest;
        window.loadTemplate = loadTemplate;
        window.loadRunHistory = loadRunHistory;
        window.viewRunDetails = viewRunDetails;
        window.closeModal = closeModal;
    </script>
</body>
</html>
