# ============================================================================
# SOC Copilot - 开发环境 Docker Compose 配置 (FR-004)
# ============================================================================
# 用法:
#   启动开发基础设施: docker compose -f docker-compose.dev.yml up -d
#   或使用 Makefile:   make dev-env-up
#
# 包含服务:
#   - PostgreSQL 15  (端口 5432)
#   - Redis 7        (端口 6379)
#   - Adminer        (端口 8080, 可选 - 数据库管理界面)
#   - RedisInsight   (端口 5540, 可选 - Redis 管理界面)
# ============================================================================

services:
  # ===========================================================================
  # PostgreSQL - 开发数据库
  # ===========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: soc-copilot-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-soc_copilot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_password}
      POSTGRES_DB: ${DB_NAME:-soc_copilot}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-soc_copilot}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dev-net
    restart: unless-stopped

  # ===========================================================================
  # Redis - 开发缓存
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: soc-copilot-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD:-dev_redis_password_change_me}
    volumes:
      - redis_dev_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dev-net
    restart: unless-stopped

  # ===========================================================================
  # Adminer - 数据库管理界面 (可选)
  # 访问: http://localhost:8080
  # 登录: System=PostgreSQL, Server=postgres, User/Password/DB 见 .env
  # ===========================================================================
  adminer:
    image: adminer:7-alpine
    container_name: soc-copilot-adminer
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dev-net
    restart: unless-stopped
    profiles:
      - tools

  # ===========================================================================
  # RedisInsight - Redis 管理界面 (可选)
  # 访问: http://localhost:5540
  # ===========================================================================
  redis-insight:
    image: redis/redisinsight:7-alpine
    container_name: soc-copilot-redis-insight
    volumes:
      - redisinsight_dev_data:/db
    ports:
      - "127.0.0.1:5540:5540"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - dev-net
    restart: unless-stopped
    profiles:
      - tools

volumes:
  postgres_dev_data:
    name: soc-copilot-postgres-dev
  redis_dev_data:
    name: soc-copilot-redis-dev
  redisinsight_dev_data:
    name: soc-copilot-redis-insight-dev

networks:
  dev-net:
    name: soc-copilot-dev
    driver: bridge
