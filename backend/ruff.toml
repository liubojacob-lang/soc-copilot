# Ruff configuration for SOC Copilot backend
# https://docs.astral.sh/ruff/

# Target Python version
target-version = "py312"

# Line length
line-length = 100

# Exclude patterns
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.egg-info",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    "migrations_alembic",
    "data",
]

# Source directories
src = ["."]

[lint]
# Enable rules
select = [
    "E",      # pycodestyle errors
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate (commented-out code)
    "RUF",    # Ruff-specific rules
]

# Ignore specific rules
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B904",   # raise without from inside except
    "ARG001", # unused function argument (common in FastAPI dependencies)
    "ARG002", # unused method argument
    "SIM108", # use ternary operator
    "PTH123", # use Path.open()
    "ERA001", # commented-out code
]

# Allow unused variables when prefixed with _
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.per-file-ignores]
"tests/*" = ["ARG", "S101", "PLR2004"]
"__init__.py" = ["F401"]

[lint.isort]
known-first-party = ["core", "models", "routers", "services", "middleware", "dependencies", "db", "schemas", "repositories"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
