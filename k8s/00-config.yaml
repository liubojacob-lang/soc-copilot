apiVersion: v1
kind: Secret
metadata:
  name: soc-copilot-secrets
  namespace: soc-copilot
type: Opaque
stringData:
  DB_PASSWORD: "CHANGE_ME_use_openssl_rand_base64_32"
  REDIS_PASSWORD: "CHANGE_ME_use_openssl_rand_base64_32"
  SECRET_KEY: "CHANGE_ME_use_openssl_rand_base64_64"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: soc-copilot-config
  namespace: soc-copilot
data:
  DB_USER: "soc_copilot"
  DB_NAME: "soc_copilot"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  ENVIRONMENT: "production"
  DIFY_API_URL: ""
  NEXT_PUBLIC_API_URL: "http://backend:8000"
