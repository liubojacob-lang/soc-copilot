services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: soc-copilot-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-soc_copilot}
      POSTGRES_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      POSTGRES_DB: ${DB_NAME:-soc_copilot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"  # Only bind to localhost for security
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-soc_copilot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - database-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: soc-copilot-redis
    command: "redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"  # Only bind to localhost
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: soc-copilot-backend
    environment:
      - "DATABASE_URL=postgresql+asyncpg://${DB_USER:-soc_copilot}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/${DB_NAME:-soc_copilot}"
      - "REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0"
      - "JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}"
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - DIFY_API_URL=${DIFY_API_URL:-}
      - DIFY_API_KEY=${DIFY_API_KEY:-}
      - AI_PROVIDER=${AI_PROVIDER:-zhipu}
      - ZHIPU_API_KEY=${ZHIPU_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - BOOTSTRAP_ADMIN_USERNAME=${BOOTSTRAP_ADMIN_USERNAME:-admin}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD is required}
      - BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
    volumes:
      - ./backend:/app
      - /app/__pycache__
    expose:
      - "8000"
    # Backend port removed from public exposure - access only via nginx proxy
    # To expose for local dev, use docker-compose.override.yml or docker-compose.dev.yml
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend-net
      - database-net
      - frontend-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Background Worker (Redis Streams Consumer & Notification Dispatcher)
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: soc-copilot-worker
    command: python workers/alert_worker.py 1
    environment:
      - "DATABASE_URL=postgresql+asyncpg://${DB_USER:-soc_copilot}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/${DB_NAME:-soc_copilot}"
      - "REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0"
      - "JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}"
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - AUTO_RUN_MIGRATIONS=false
    volumes:
      - ./backend:/app
      - /app/__pycache__
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend-net
      - database-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: soc-copilot-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NODE_ENV=${NODE_ENV:-production}
    expose:
      - "3000"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - frontend-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # Nginx Reverse Proxy (Production)
  nginx:
    image: nginx:1.26-alpine
    container_name: soc-copilot-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    networks:
      - frontend-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
    internal: true  # Prevent external access
  database-net:
    driver: bridge
    internal: true  # Prevent external access
