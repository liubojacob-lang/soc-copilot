groups:
  - name: soc-backend
    rules:
      - alert: HighApiErrorRate
        expr: sum(rate(soc_api_requests_total{status=~"5.."}[5m])) / sum(rate(soc_api_requests_total[5m])) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "SOC API 5xx error rate is above 5%"
      - alert: QueueLagTooHigh
        expr: max(soc_queue_lag) > 500
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Alert processing queue backlog exceeded 500 messages"
      - alert: HighP99Latency
        expr: histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 3.0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Core API P99 response time exceeded 3.0 seconds"
      - alert: High5xxRateCritical
        expr: sum(rate(soc_api_requests_total{status=~"5.."}[2m])) / sum(rate(soc_api_requests_total[2m])) > 0.01
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "API 5xx error rate exceeded 1% critical threshold"
