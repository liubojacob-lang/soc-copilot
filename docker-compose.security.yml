# SOC Copilot Security Stack
# Elasticsearch + Kibana + Wazuh Manager

services:
  # ============================================
  # Elasticsearch - 日志存储
  # ============================================
  elasticsearch:
    image: soc-elasticsearch:8.12.0
    container_name: soc-elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      - xpack.security.enabled=false
      - "indices.id_field_data.enabled=true"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - soc-copilot-network
    restart: unless-stopped

  # ============================================
  # Kibana - 可视化界面 (替代 Wazuh Dashboard)
  # ============================================
  kibana:
    image: soc-kibana:8.12.0
    container_name: soc-kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_NAME=kibana
      - SERVER_HOST="0.0.0.0"
    volumes:
      - kibana_data:/usr/share/kibana/data
    ports:
      - "5601:5601"
    networks:
      - soc-copilot-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  # ============================================
  # Wazuh Manager - SIEM 核心引擎
  # ============================================
  wazuh-manager:
    image: soc-wazuh-manager:4.12.0
    container_name: soc-wazuh-manager
    hostname: wazuh-manager
    ports:
      - "1514:1514/tcp"
      - "1514:1514/udp"
      - "55000:55000/tcp"
    environment:
      - INDEXER_URL=http://elasticsearch:9200
      - INDEXER_USERNAME=elastic
      - INDEXER_PASSWORD=${ELASTICSEARCH_PASSWORD:-SecureP@ssw0rd123!}
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${WAZUH_API_PASSWORD:-WazuhP@ssw0rd123!}
      - WAZUH_QUEUE_SIZE=1000000
      - INDEXER_INSECURE=yes
    volumes:
      - wazuh_data:/var/ossec/data
      - ./config/wazuh/ossec.conf:/var/ossec/etc/ossec.conf:ro
    networks:
      - soc-copilot-network
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

volumes:
  elasticsearch_data:
    name: sec-elasticsearch-data
  kibana_data:
    name: sec-kibana-data
  wazuh_data:
    name: sec-wazuh-data

networks:
  soc-copilot-network:
    name: soc-copilot-network
    external: true
