# Wazuh Docker Compose Configuration
# Version: 4.8.0
#
# This stack includes:
# - Wazuh Manager (ports 1514, 1515, 1516, 55000)
# - Wazuh Indexer (OpenSearch - port 9200)
# - Wazuh Dashboard (Web UI - port 5601)
# - PostgreSQL Database (port 5432)

version: '3.8'

services:
  # Wazuh Indexer (OpenSearch)
  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.8.0
    container_name: wazuh.indexer
    hostname: wazuh.indexer
    restart: unless-stopped
    ports:
      - "9200:9200"  # OpenSearch API
      - "9300:9300"  # OpenSearch transport
    environment:
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m  # Memory settings
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - DISABLE_SECURITY_PLUGIN=false  # Enable security
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${WAZUH_INDEXER_PASSWORD:-ChangeThisPassword123!}
    volumes:
      - wazuh-indexer-data:/var/lib/opensearch
      - ./config/wazuh-indexer/opensearch.yml:/usr/share/opensearch/config/opensearch.yml:ro
      - ./config/wazuh-indexer/security.ini:/usr/share/opensearch/plugins/opensearch-security/securityconfig/config.yml:ro
    networks:
      - wazuh-net
    healthcheck:
      test: ["CMD-SHELL", "curl -k -u admin:${WAZUH_INDEXER_PASSWORD:-ChangeThisPassword123!} https://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Wazuh Manager
  wazuh.manager:
    image: wazuh/wazuh-manager:4.8.0
    container_name: wazuh.manager
    hostname: wazuh.manager
    restart: unless-stopped
    depends_on:
      wazuh.indexer:
        condition: service_healthy
    ports:
      - "1514:1514"      # API (JSON)
      - "1515:1515"      # API (JSON)
      - "1516:1516"      # Syslog
      - "55000:55000"    # Wazuh API
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD:-ChangeThisPassword123!}
      - FILEBEAT_PASSWORD=${FILEBEAT_PASSWORD:-FilebeatPassword123!}
      - API_USERNAME=${WAZUH_API_USERNAME:-wazuh-wui}
      - API_PASSWORD=${WAZUH_API_PASSWORD:-wazuh-wui-password}
      - WAZUH_EMAIL=${WAZUH_EMAIL:-wazuh@example.com}
    volumes:
      - wazuh-manager-data:/var/ossec/data
      - ./config/wazuh-manager/ossec.conf:/var/ossec/data/etc/ossec.conf:ro
      - ./config/wazuh-manager/api.yaml:/var/ossec/api/configuration/api.yaml:ro
      - ./config/wazuh-manager/rules:/var/ossec/etc/rules:ro
      - ./config/wazuh-manager/decoders:/var/ossec/etc/decoders:ro
    networks:
      - wazuh-net
    healthcheck:
      test: ["CMD-SHELL", "curl -k https://localhost:55000/healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Wazuh Dashboard
  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.8.0
    container_name: wazuh.dashboard
    hostname: wazuh.dashboard
    restart: unless-stopped
    depends_on:
      wazuh.indexer:
        condition: service_healthy
      wazuh.manager:
        condition: service_healthy
    ports:
      - "5601:5601"  # Web UI
    environment:
      - OPENSEARCH_URL=https://wazuh.indexer:9200
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=${WAZUH_INDEXER_PASSWORD:-ChangeThisPassword123!}
      - WAZUH_API_URL=https://wazuh.manager:55000
      - WAZUH_API_USERNAME=${WAZUH_API_USERNAME:-wazuh-wui}
      - WAZUH_API_PASSWORD=${WAZUH_API_PASSWORD:-wazuh-wui-password}
    volumes:
      - ./config/wazuh-dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
      - ./config/wazuh-dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml:ro
    networks:
      - wazuh-net
    healthcheck:
      test: ["CMD-SHELL", "curl -k https://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # PostgreSQL Database (optional, for SOC Copilot integration)
  wazuh.db:
    image: postgres:15-alpine
    container_name: wazuh.db
    hostname: wazuh.db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${WAZUH_DB_USER:-wazuh}
      - POSTGRES_PASSWORD=${WAZUH_DB_PASSWORD:-wazuh-db-password}
      - POSTGRES_DB=${WAZUH_DB_NAME:-wazuh}
    volumes:
      - wazuh-db-data:/var/lib/postgresql/data
    networks:
      - wazuh-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAZUH_DB_USER:-wazuh} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  wazuh-net:
    driver: bridge
    name: wazuh-net

volumes:
  wazuh-indexer-data:
    name: wazuh-indexer-data
  wazuh-manager-data:
    name: wazuh-manager-data
  wazuh-db-data:
    name: wazuh-db-data
