version: 2

updates:
  # 前端 NPM 依赖
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    reviewers:
      - levent
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: "deps(frontend)"
    ignore:
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
    groups:
      core-framework:
        patterns:
          - "next"
          - "react"
          - "react-dom"
      frontend-dependencies:
        patterns:
          - "*"

  # 后端 Python 依赖
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    reviewers:
      - levent
    labels:
      - dependencies
      - backend
    commit-message:
      prefix: "deps(backend)"
    groups:
      core-backend:
        patterns:
          - "fastapi"
          - "uvicorn"
          - "pydantic*"
          - "sqlalchemy*"
          - "alembic"
      backend-dependencies:
        patterns:
          - "*"

  # Docker 依赖
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - docker
    groups:
      docker-images:
        patterns:
          - "*"

  # GitHub Actions 依赖
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - ci-cd
    groups:
      github-actions:
        patterns:
          - "*"
