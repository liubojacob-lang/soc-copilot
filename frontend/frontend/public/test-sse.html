<!DOCTYPE html>
<html>
<head>
    <title>SSE Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        #status { font-weight: bold; margin: 10px 0; }
        .connected { color: green; }
        .error { color: red; }
        #output { border: 1px solid #ccc; padding: 10px; height: 300px; overflow-y: auto; background: #f5f5f5; }
        p { margin: 5px 0; }
    </style>
</head>
<body>
    <h1>SSE Connection Test</h1>
    <div id="status">Initializing...</div>
    <div id="output"></div>
    <script>
        const statusDiv = document.getElementById('status');
        const outputDiv = document.getElementById('output');
        let messageCount = 0;
        
        function log(msg, type = 'info') {
            const p = document.createElement('p');
            p.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
            if (type === 'error') p.style.color = 'red';
            if (type === 'success') p.style.color = 'green';
            outputDiv.appendChild(p);
            outputDiv.scrollTop = outputDiv.scrollHeight;
        }
        
        log('Starting EventSource connection...');
        
        try {
            const eventSource = new EventSource('/api/monitor/stream');
            
            eventSource.onopen = () => {
                log('Connection opened successfully!', 'success');
                statusDiv.innerHTML = '<span class="connected">✓ Connected</span>';
            };
            
            eventSource.onmessage = (event) => {
                messageCount++;
                try {
                    const data = JSON.parse(event.data);
                    if (data.heartbeat) {
                        log('Heartbeat #' + messageCount, 'info');
                    } else {
                        log('Data received: ' + JSON.stringify(data).substring(0, 80) + '...', 'success');
                    }
                } catch (err) {
                    log('Failed to parse: ' + event.data, 'error');
                }
            };
            
            eventSource.onerror = (err) => {
                log('Connection error occurred', 'error');
                console.error('SSE Error:', err);
                statusDiv.innerHTML = '<span class="error">✗ Error (check console)</span>';
            };
        } catch (err) {
            log('Failed to create EventSource: ' + err.message, 'error');
            statusDiv.innerHTML = '<span class="error">✗ Failed</span>';
        }
    </script>
</body>
</html>
