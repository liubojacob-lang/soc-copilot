# Security Gate — Required PR Check
# S0-21: Consolidates pip-audit, npm audit, and bandit as a PR-blocking gate.
# This workflow runs on every PR targeting main and is configured as a
# required status check in branch protection rules.

name: Security Gate (Required)

on:
  pull_request:
    branches: [main, "release/*"]
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/security-gate.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/security-gate.yml'

  # ── Python Dependency Audit (pip-audit) ──
  pip-audit:
    name: pip-audit (Python Deps)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Run pip-audit
        id: audit
        working-directory: ./backend
        run: |
          set -o pipefail
          pip-audit --requirement=requirements.txt --format=json --output=pip-audit-report.json 2>&1 | tee pip-audit-output.txt
          # pip-audit exits non-zero when vulnerabilities are found
          # We parse the report to decide severity threshold
          python -c "
          import json, sys
          with open('pip-audit-report.json') as f:
              data = json.load(f)
          high_critical = 0
          for dep in data:
              for v in dep.get('vulnerabilities', []):
                  aliases = v.get('aliases', [])
                  # GHSA/CVE/RUSTSEC/PYSEC are serious identifiers
                  if any(a.startswith(('GHSA-', 'CVE-', 'RUSTSEC-', 'PYSEC-')) for a in aliases):
                      high_critical += 1
          print(f'High/Critical vulnerabilities found: {high_critical}')
          if high_critical > 0:
              print('::error::High or critical vulnerabilities detected. Please upgrade affected dependencies.')
              sys.exit(1)
          print('No high/critical vulnerabilities — gate passed.')
          "

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-gate-report
          path: backend/pip-audit-report.json
          retention-days: 30

  # ── Frontend Dependency Audit (npm audit) ──
  npm-audit:
    name: npm audit (Frontend Deps)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run npm audit
        working-directory: ./frontend
        run: |
          set -o pipefail
          npm audit --json 2>&1 | tee npm-audit-output.json
          # npm audit exits non-zero when vulnerabilities are found
          # Parse for high/critical only
          python -c "
          import json, sys, os
          try:
              with open('npm-audit-output.json') as f:
                  raw = f.read().strip()
              data = json.loads(raw)
              advisories = data.get('advisories', {})
              high_critical = 0
              for adv_id, adv in advisories.items():
                  sev = adv.get('severity', '').lower()
                  if sev in ('high', 'critical'):
                      high_critical += 1
                      print(f'  [{sev.upper()}] {adv.get("module_name", "?")} — {adv.get("title", adv_id)}')
              print(f'High/Critical vulnerabilities found: {high_critical}')
              if high_critical > 0:
                  print('::error::High or critical npm vulnerabilities detected. Please upgrade or audit affected packages.')
                  sys.exit(1)
              print('No high/critical npm vulnerabilities — gate passed.')
          except (json.JSONDecodeError, AttributeError):
              # npm audit can output non-JSON when there are no vulns
              if 'found 0 vulnerabilities' in raw or 'no known vulnerabilities' in raw.lower():
                  print('No vulnerabilities found — gate passed.')
              else:
                  print('Could not parse npm audit output, skipping...')
          "

  # ── Python SAST (Bandit) ──
  bandit:
    name: Bandit SAST (Python)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit (high-severity only)
        id: bandit
        working-directory: ./backend
        run: |
          set -o pipefail
          bandit -r . -f json -o bandit-gate-report.json -ll 2>&1 || true
          # Check for high-confidence/high-severity issues
          python -c "
          import json, sys
          try:
              with open('bandit-gate-report.json') as f:
                  data = json.load(f)
          except (json.JSONDecodeError, FileNotFoundError):
              print('Bandit report not generated — gate passed (no issues detected).')
              sys.exit(0)

          results = data.get('results', [])
          blocked = [
              r for r in results
              if r.get('issue_severity', '').upper() in ('HIGH', 'MEDIUM')
              and r.get('issue_confidence', '').upper() in ('HIGH',)
          ]
          if blocked:
              print(f'Blocked {len(blocked)} high-confidence issues:')
              for r in blocked:
                  print(f'  [{r.get("issue_severity", "?")}/{r.get("issue_confidence", "?")}] '
                        f'{r.get("filename", "?")}:{r.get("line_number", "?")} — '
                        f'{r.get("test_name", "?")}: {r.get("issue_text", "?")}')
              print('::error::Bandit found high-confidence security issues. Please fix before merging.')
              sys.exit(1)
          else:
              print('No high-confidence issues found — Bandit gate passed.')
          "

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-gate-report
          path: backend/bandit-gate-report.json
          retention-days: 30

  # ── Gate Summary ──
  security-gate-summary:
    name: Security Gate Summary
    runs-on: ubuntu-latest
    needs: [pip-audit, npm-audit, bandit]
    if: always()
    steps:
      - name: Report gate status
        run: |
          echo "## 🔒 Security Gate Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| pip-audit (Python Deps) | ${{ needs.pip-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| npm audit (Frontend Deps) | ${{ needs.npm-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Bandit SAST (Python) | ${{ needs.bandit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note**: This gate is configured as a required PR check. All three scans must pass before merging." >> $GITHUB_STEP_SUMMARY

          # Fail the summary if any check failed
          if [ "${{ needs.pip-audit.result }}" != "success" ] ||              [ "${{ needs.npm-audit.result }}" != "success" ] ||              [ "${{ needs.bandit.result }}" != "success" ]; then
            echo "❌ Security gate FAILED — please fix the issues above before merging."
            exit 1
          fi
          echo "✅ Security gate PASSED — all checks clear."
