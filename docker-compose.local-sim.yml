# SOC Copilot 本地独立仿真编排 (与宿主机当前服务完全隔离)
# 端口映射均已错开，不会与 5432 / 6379 / 8088 / 3003 产生冲突
services:
  postgres:
    image: postgres:15-alpine
    container_name: soc-postgres-sim
    environment:
      POSTGRES_USER: ${SIM_DB_USER:-soc_sim_user}
      POSTGRES_PASSWORD: ${SIM_DB_PASSWORD:-soc_sim_password_123456}
      POSTGRES_DB: ${SIM_DB_NAME:-soc_sim_db}
    volumes:
      - postgres_sim_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${HOST_PORT_POSTGRES:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SIM_DB_USER:-soc_sim_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - soc-sim-net
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: soc-redis-sim
    command: redis-server --appendonly yes --requirepass ${SIM_REDIS_PASSWORD:-soc_sim_redis_123456}
    volumes:
      - redis_sim_data:/data
    ports:
      - "127.0.0.1:${HOST_PORT_REDIS:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${SIM_REDIS_PASSWORD:-soc_sim_redis_123456}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - soc-sim-net
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: soc-copilot-backend:local-sim
    container_name: soc-backend-sim
    environment:
      - "DB_USER=${SIM_DB_USER:-soc_sim_user}"
      - "DB_PASSWORD=${SIM_DB_PASSWORD:-soc_sim_password_123456}"
      - "DB_NAME=${SIM_DB_NAME:-soc_sim_db}"
      - "DATABASE_URL=postgresql+asyncpg://${SIM_DB_USER:-soc_sim_user}:${SIM_DB_PASSWORD:-soc_sim_password_123456}@postgres:5432/${SIM_DB_NAME:-soc_sim_db}"
      - "REDIS_URL=redis://:${SIM_REDIS_PASSWORD:-soc_sim_redis_123456}@redis:6379/0"
      - "REDIS_ENABLED=true"
      - "REDIS_PASSWORD=${SIM_REDIS_PASSWORD:-soc_sim_redis_123456}"
      - "JWT_SECRET=${JWT_SECRET:-sim_jwt_secret_must_be_32_characters_long_soc_copilot}"
      - "BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD:-K9#mX2_vL8!qZ5*wR7}"
      - "BOOTSTRAP_ADMIN_USERNAME=${BOOTSTRAP_ADMIN_USERNAME:-admin}"
      - "BOOTSTRAP_ADMIN_EMAIL=${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}"
      - "SECRET_ENCRYPTION_KEY=${SECRET_ENCRYPTION_KEY:-e3Zq5lV7x1r9p2m4k6j8h0f3d5s7a1c9b2e4g6i8k0m=}"
      - "HTTP_ALLOWED_HOSTS=${HTTP_ALLOWED_HOSTS:-*}"
      - "CORS_ORIGINS=${CORS_ORIGINS:-*}"
      - "ENVIRONMENT=${ENVIRONMENT:-development}"
      - "COOKIE_SECURE=${COOKIE_SECURE:-false}"
      - "STRICT_PRODUCTION_CHECKS=${STRICT_PRODUCTION_CHECKS:-false}"
      - "LOG_LEVEL=INFO"
      - "WORKERS=2"
      - "AI_PROVIDER=${AI_PROVIDER:-zhipu}"
      - "ZHIPU_API_KEY=${ZHIPU_API_KEY:-3c3bf3d16aa54b45a80d176af5b42ff9.QLEMk5ivt6jq8UQy}"
      - "ZHIPU_MODEL=${ZHIPU_MODEL:-glm-4-flash}"
      - "NVIDIA_API_KEY=${NVIDIA_API_KEY:-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}"
      - "NVIDIA_MODEL=${NVIDIA_MODEL:-meta/llama-3.2-11b-vision-instruct}"
      - "AI_TIMEOUT=${AI_TIMEOUT:-90}"
    ports:
      - "127.0.0.1:${HOST_PORT_BACKEND:-18088}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - soc-sim-net
    restart: "no"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: soc-copilot-frontend:local-sim
    container_name: soc-frontend-sim
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NODE_ENV=production
    ports:
      - "127.0.0.1:${HOST_PORT_FRONTEND:-13000}:3000"
    depends_on:
      - backend
    networks:
      - soc-sim-net
    restart: "no"

volumes:
  postgres_sim_data:
  redis_sim_data:

networks:
  soc-sim-net:
    driver: bridge
