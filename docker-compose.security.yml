# SOC Copilot Security Stack
# Elasticsearch + Kibana + Wazuh Manager
#
# P0-6: Security is now ENABLED by default. Elasticsearch runs with
# xpack.security enabled (TLS + auth). To bootstrap:
#   1. Generate strong passwords and export them (or set in .env.security):
#        export ELASTICSEARCH_PASSWORD=$(openssl rand -base64 24)
#        export KIBANA_SYSTEM_PASSWORD=$(openssl rand -base64 24)
#        export WAZUH_API_PASSWORD=$(openssl rand -base64 24)
#   2. On first ES start, set the elastic password and Kibana service account:
#        docker exec soc-elasticsearch bin/elasticsearch-reset-password -u elastic -i -p "$ELASTICSEARCH_PASSWORD"
#        docker exec soc-elasticsearch bin/elasticsearch-service-tokens create kibana kibana-token  # or use elasticsearch-setup-users
#   3. For local dev without TLS, set ES_SECURITY_ENABLED=false (NOT for production).
# Ports are bound to 127.0.0.1 to avoid exposing the SIEM stack publicly.

services:
  # ============================================
  # Elasticsearch - 日志存储
  # ============================================
  elasticsearch:
    image: soc-elasticsearch:8.12.0
    container_name: soc-elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      # P0-6: security enabled by default. Set ES_SECURITY_ENABLED=false ONLY for local dev.
      - xpack.security.enabled=${ES_SECURITY_ENABLED:-true}
      - xpack.security.transport.ssl.enabled=${ES_SECURITY_ENABLED:-true}
      - xpack.security.http.ssl.enabled=${ES_SECURITY_ENABLED:-true}
      - "indices.id_field_data.enabled=true"
      - "ELASTIC_PASSWORD=${ELASTICSEARCH_PASSWORD:?ELASTICSEARCH_PASSWORD is required - generate one with: openssl rand -base64 24}"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      # P0-6: bind to localhost only — do not expose ES to public interfaces
      - "127.0.0.1:9200:9200"
      - "127.0.0.1:9300:9300"
    healthcheck:
      test: ["CMD-SHELL", "curl -sk https://elastic:${ELASTICSEARCH_PASSWORD}@localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - soc-copilot-network
    restart: unless-stopped

  # ============================================
  # Kibana - 可视化界面 (替代 Wazuh Dashboard)
  # ============================================
  kibana:
    image: soc-kibana:8.12.0
    container_name: soc-kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      # P0-6: HTTPS when ES security enabled (default). If you set
      # ES_SECURITY_ENABLED=false for local dev, also change this to http://
      - ELASTICSEARCH_HOSTS=https://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=elastic
      - "ELASTICSEARCH_PASSWORD=${ELASTICSEARCH_PASSWORD:?ELASTICSEARCH_PASSWORD is required}"
      - ELASTICSEARCH_SSL_VERIFICATIONMODE=none
      - SERVER_NAME=kibana
      - SERVER_HOST="0.0.0.0"
    volumes:
      - kibana_data:/usr/share/kibana/data
    ports:
      - "127.0.0.1:5601:5601"
    networks:
      - soc-copilot-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  # ============================================
  # Wazuh Manager - SIEM 核心引擎
  # ============================================
  wazuh-manager:
    image: soc-wazuh-manager:4.12.0
    container_name: soc-wazuh-manager
    hostname: wazuh-manager
    ports:
      - "127.0.0.1:1514:1514/tcp"
      - "127.0.0.1:1514:1514/udp"
      - "127.0.0.1:55000:55000/tcp"
    environment:
      # P0-6: HTTPS + auth; INDEXER_INSECURE defaults to no (verify TLS).
      # Set INDEXER_INSECURE=yes ONLY for dev with self-signed certs.
      - INDEXER_URL=https://elasticsearch:9200
      - INDEXER_USERNAME=elastic
      - "INDEXER_PASSWORD=${ELASTICSEARCH_PASSWORD:?ELASTICSEARCH_PASSWORD is required}"
      - API_USERNAME=wazuh-wui
      - "API_PASSWORD=${WAZUH_API_PASSWORD:?WAZUH_API_PASSWORD is required - generate one with: openssl rand -base64 24}"
      - WAZUH_QUEUE_SIZE=1000000
      - INDEXER_INSECURE=${INDEXER_INSECURE:-no}
    volumes:
      - wazuh_data:/var/ossec/data
      - ./config/wazuh/ossec.conf:/var/ossec/etc/ossec.conf:ro
    networks:
      - soc-copilot-network
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

volumes:
  elasticsearch_data:
    name: sec-elasticsearch-data
  kibana_data:
    name: sec-kibana-data
  wazuh_data:
    name: sec-wazuh-data

networks:
  soc-copilot-network:
    name: soc-copilot-network
    external: true
