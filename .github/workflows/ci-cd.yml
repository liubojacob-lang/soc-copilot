name: CI/CD Pipeline

on:
  push:
    branches: [master, develop, "release/*"]
    tags: ["v*"]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # Backend Lint
  backend-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.16.8 black==26.5.1 mypy

      - name: Run Ruff (fast linter)
        run: ruff check backend/ --output-format=github

      - name: Auto-fix Ruff issues (if any)
        if: failure()
        run: |
          ruff check --fix backend/
          echo "::warning::Ruff issues were auto-fixed. Please commit the changes."

      - name: Run Black (code formatting check)
        run: black --check backend/

      - name: Format code with Black (if needed)
        if: failure()
        run: |
          black backend/
          echo "::warning::Code was auto-formatted. Please commit the changes."

      # Import sorting is enforced by ruff isort rules (I001) configured in backend/ruff.toml.
      # MyPy stays informational until type-annotation coverage work (Phase 4) lands.
      - name: Run MyPy (type checking, informational)
        run: |
          pip install -r backend/requirements.txt
          mypy backend/ --ignore-missing-imports --no-error-summary
        continue-on-error: true

  # Backend Tests
  backend-tests:
    runs-on: ubuntu-latest
    needs: backend-lint

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run tests with coverage
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_db
          SECRET_KEY: test-secret-key-for-ci-only-min-32-chars
          JWT_SECRET: test-jwt-secret-key-for-ci-only-min-32-chars
          ENVIRONMENT: test
        run: |
          pytest tests/ -v --cov=. --cov-report=xml --cov-report=term-missing --cov-fail-under=30

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          file: ./backend/coverage.xml
          flags: backend
          name: backend-coverage

  # Frontend Lint
  frontend-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Auto-fix ESLint issues (if any)
        working-directory: ./frontend
        if: failure()
        run: |
          npm run lint:fix
          echo "::warning::ESLint issues were auto-fixed. Please commit the changes."

      - name: Check code formatting with Prettier
        working-directory: ./frontend
        run: npm run format:check

      - name: Format code with Prettier (if needed)
        working-directory: ./frontend
        if: failure()
        run: |
          npm run format
          echo "::warning::Code was auto-formatted. Please commit the changes."

      - name: Run TypeScript type checking
        working-directory: ./frontend
        run: npm run type-check

  # Frontend Tests
  frontend-tests:
    runs-on: ubuntu-latest
    needs: frontend-lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application
        working-directory: ./frontend
        run: npm run build

      - name: Run tests with coverage
        working-directory: ./frontend
        run: npm run test:coverage

  # Security Scan
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run Bandit (Python security)
        working-directory: ./backend
        run: |
          pip install bandit
          bandit -r . -f json -o bandit-report.json -ll

      - name: Run npm audit (Node security)
        working-directory: ./frontend
        run: npm audit --audit-level=high

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            backend/bandit-report.json

  # Build and Push Docker Images
  build-and-push:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, security-scan]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/soc-copilot-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/soc-copilot-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/soc-copilot-frontend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/soc-copilot-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to Staging
  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    environment: staging

    steps:
      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add your deployment commands here
          # kubectl apply -f k8s/staging/
          # or
          # ssh user@staging-server 'docker-compose pull && docker-compose up -d'

  # Deploy to Production
  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    environment: production

    steps:
      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          # Add your production deployment commands here
